<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEMO — Chi tiết ca bảo hành theo 8 bước quy trình</title>
<style>
:root{
  --ink:#0f172a;--ink2:#334155;--ink3:#64748b;--ink4:#94a3b8;--line:#e2e8f0;--bg:#f6f8fb;--card:#fff;
  --ocean:#0b6bcb;--ocean1:#e0efff;--teal:#0f9d76;--teal1:#d9f5ec;--amber:#f59e0b;--amber1:#fff4dc;
  --red:#dc2626;--red1:#fee2e2;--orange:#ea580c;--orange1:#ffedd5;--pink:#be185d;--pink1:#fce7f3;
  --blue:#7cc8ef;--blue1:#e3f4fc;--violet:#7c3aed;--violet1:#ede9fe;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.top{position:sticky;top:0;z-index:30;background:#0b2545;color:#fff;display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
.top .brand{font-weight:700;font-size:15px}
.top .brand small{display:block;font-weight:400;font-size:11px;color:#9fb6d6}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav button{background:transparent;border:1px solid transparent;color:#cfe0f5;padding:7px 12px;border-radius:8px}
.top nav button.on{background:#fff;color:#0b2545;font-weight:600}
.top nav button:hover:not(.on){border-color:#3b5b85}
.demo-flag{margin-left:auto;background:#f59e0b;color:#1f1300;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
main{padding:16px 18px 60px;max-width:1500px;margin:0 auto}
section{display:none}section.on{display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;color:var(--ink2)}
.btn:hover{background:#f1f5f9}
.btn.pri{background:var(--ocean);border-color:var(--ocean);color:#fff}
.btn.pri:hover{background:#0957a6}
.btn.warn{background:#fff;border-color:#fca5a5;color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#f1f5f9;color:var(--ink2);white-space:nowrap}
.b-amber{background:var(--amber1);color:#92400e}.b-teal{background:var(--teal1);color:#065f46}.b-red{background:var(--red1);color:#991b1b}
.b-ocean{background:var(--ocean1);color:#0b4a8b}.b-pink{background:var(--pink1);color:var(--pink)}.b-violet{background:var(--violet1);color:#5b21b6}
.b-orange{background:var(--orange1);color:#9a3412}
.muted{color:var(--ink3)}.small{font-size:12px}
h2{font-size:18px;margin:0 0 6px}h3{font-size:15px;margin:0 0 8px}
/* ===== Chi tiết ca ===== */
.picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.picker input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:220px}
.picker select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:420px}
.chead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.chead .id{font-size:20px;font-weight:700}
.chead .meta{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--ink2);margin-top:4px}
.chead .meta b{color:var(--ink)}
.chead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.flowwrap{overflow-x:auto;padding-bottom:4px}
.flow{display:grid;grid-template-columns:repeat(8,minmax(150px,1fr));grid-template-rows:auto auto auto auto auto;min-width:1220px}
.col{display:grid;grid-row:span 5;grid-template-rows:subgrid;padding:0 6px}
.shead{display:flex;align-items:baseline;gap:6px;min-height:40px}
.shead .no{font-size:12px;color:var(--ink4);font-weight:700}
.shead .nm{font-weight:700;font-size:13px}
.col.skip .shead .nm{color:var(--ink4);text-decoration:line-through}
.rail{position:relative;height:34px;display:flex;align-items:center;justify-content:center}
.rail::before{content:"";position:absolute;top:50%;height:4px;margin-top:-2px;left:-6px;right:-6px;background:#d6dde6}
.col:first-child .rail::before{left:50%}.col:last-child .rail::before{right:50%}
.col.done .rail::before{background:var(--teal)}
.col.cur .rail::before{background:linear-gradient(90deg,var(--teal) 50%,#d6dde6 50%)}
.col.skip .rail::before{background:repeating-linear-gradient(90deg,#c3ccd8 0 6px,transparent 6px 11px)}
.dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #c3ccd8;background:#fff;color:var(--ink4);cursor:pointer}
.col.done .dot{background:var(--teal);border-color:var(--teal);color:#fff}
.col.cur .dot{background:var(--amber);border-color:var(--amber);color:#fff;width:34px;height:34px;box-shadow:0 0 0 0 rgba(245,158,11,.6);animation:pulse 1.6s infinite}
.col.skip .dot{border-style:dashed;background:#f8fafc}
.col.hasbad .dot::after{content:"!";position:absolute;top:-6px;right:-6px;width:15px;height:15px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.55)}70%{box-shadow:0 0 0 10px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.when{text-align:center;font-size:12px;min-height:34px;margin-top:2px}
.when .t{font-weight:600}.when .gap{color:var(--ink3)}
.col.cur .when{color:#b45309;font-weight:600}
.col.todo .when,.col.skip .when{color:var(--ink4)}
.metrics{min-height:90px;border-top:1px dashed var(--line);padding:6px 2px;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.metrics .m{color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;padding:1px 7px;border-radius:6px;border:1px solid;cursor:default;width:max-content;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.loi{background:var(--red1);border-color:#fca5a5;color:#991b1b}
.chip.auto{background:var(--orange1);border-color:#fdba74;color:#9a3412}
.chip.sla72{background:var(--pink1);border-color:#f9a8d4;color:var(--pink);font-weight:600}
.chip.ok{background:var(--teal1);border-color:#86efac;color:#065f46}
.chip.bo{background:#f1f5f9;border-color:#cbd5e1;color:var(--ink4);text-decoration:line-through}
.scard{margin-top:8px;background:var(--blue1);border:1px solid var(--blue);border-radius:8px;padding:8px 10px;min-height:128px;display:flex;flex-direction:column;font-size:12.5px}
.scard .ti{font-weight:700;font-size:12px;color:#075985}
.scard .sub{font-size:11px;color:#0369a1;margin-bottom:4px}
.scard .ln{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .xem{margin-top:auto;padding-top:6px}
.scard .xem button{background:none;border:none;color:var(--ocean);font-weight:600;padding:0;font-size:12px}
.scard.open{outline:2px solid var(--ocean);background:#fff}
.scard.skip{background:#f8fafc;border:1px dashed #cbd5e1;color:var(--ink4);justify-content:center;text-align:center}
.scard.todo{background:#f8fafc;border-color:#e2e8f0}
.scard.cur{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.panel{border:2px solid var(--ocean);border-radius:12px;background:#fff;padding:14px 16px;margin-top:12px}
.panel h3{display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px}
.kv div{font-size:13px}.kv span{display:block;font-size:11px;color:var(--ink3)}
table.mini{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
table.mini th,table.mini td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.mini th{background:#f8fafc;font-size:12px;color:var(--ink3)}
.toggle-all{margin-top:12px}
.vlog{margin-top:10px;border-left:3px solid var(--line);padding-left:14px}
.vlog .e{position:relative;padding:5px 0}
.vlog .e::before{content:"";position:absolute;left:-21px;top:10px;width:11px;height:11px;border-radius:50%;background:var(--ocean)}
.vlog .e.loi::before{background:var(--red)}.vlog .e.gt::before{background:var(--violet)}
.vlog .e .tt{font-size:12px;color:var(--ink3)}
.otherbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px;border:2px solid #c3ccd8}
/* ===== Tồn theo bước ===== */
.tonlayout{display:grid;grid-template-columns:230px 1fr;gap:14px}
@media (max-width:900px){.tonlayout{grid-template-columns:1fr}}
.side{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;align-self:start;position:sticky;top:64px}
.side .grp{font-size:11px;color:var(--ink4);text-transform:uppercase;letter-spacing:.04em;padding:8px 8px 4px}
.side button{display:flex;width:100%;align-items:center;gap:8px;border:none;background:none;padding:7px 8px;border-radius:8px;text-align:left;color:var(--ink2)}
.side button:hover{background:#f1f5f9}
.side button.on{background:var(--ocean1);color:#0b4a8b;font-weight:600}
.side button .n{width:20px;height:20px;border-radius:50%;background:#e2e8f0;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.side button.on .n{background:var(--ocean);color:#fff}
.side button .c{margin-left:auto;font-size:12px;background:#f1f5f9;border-radius:999px;padding:0 7px}
.side button .c.hot{background:var(--red1);color:#991b1b}
.side button.dis{opacity:.55}
.funnel{display:grid;grid-template-columns:repeat(8,minmax(118px,1fr));gap:0;overflow-x:auto}
.fbox{position:relative;border:1px solid var(--line);border-right:none;padding:10px;background:#fff;cursor:pointer;min-width:118px}
.fbox:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.fbox:first-child{border-radius:10px 0 0 10px}
.fbox:hover{background:#f8fbff}
.fbox .h{font-size:11px;color:var(--ink3);font-weight:700}
.fbox .t{font-weight:700;font-size:13px;min-height:34px}
.fbox .big{font-size:26px;font-weight:800;color:var(--ocean)}
.fbox .big.zero{color:var(--ink4)}
.fbox .s{font-size:11.5px;color:var(--ink3)}
.fbox .bar{height:5px;border-radius:3px;background:#eef2f7;margin-top:6px;overflow:hidden}
.fbox .bar i{display:block;height:100%;background:var(--red)}
.fbox.sel{outline:2px solid var(--ocean);outline-offset:-2px;background:#f5faff}
table.mx{border-collapse:collapse;font-size:13px;width:100%}
table.mx th,table.mx td{border:1px solid var(--line);padding:5px 8px;text-align:center}
table.mx th{background:#f8fafc;font-size:12px}
table.mx td.cl{cursor:pointer}table.mx td.cl:hover{background:var(--ocean1)}
table.mx td.hot{background:#fff1f2;color:#9f1239;font-weight:700}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;min-width:140px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--ink3)}
.kpi.red b{color:var(--red)}
/* ===== Bảng Excel ===== */
.xt-bar{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap;font-size:13px}
.xt-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:620px}
table.xt{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.xt th{position:sticky;top:0;background:#f8fafc;z-index:2;border-bottom:1px solid var(--line);padding:0;text-align:left;white-space:nowrap}
table.xt th .hw{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 8px}
table.xt th .lb{cursor:pointer;flex:1;font-size:12px;color:var(--ink2);font-weight:600;user-select:none}
table.xt th .ar{font-size:10px;color:var(--ocean);margin-left:3px}
table.xt th .fb{border:1px solid transparent;background:none;border-radius:5px;padding:1px 4px;color:var(--ink4);font-size:12px}
table.xt th .fb:hover{border-color:var(--line)}
table.xt th.act{background:#fff7e6}
table.xt th.act .fb{color:#fff;background:var(--amber)}
table.xt th .x{border:none;background:none;color:var(--red);font-size:13px;padding:0 3px}
table.xt td{border-bottom:1px solid #eef2f7;padding:6px 8px;vertical-align:top}
table.xt tbody tr{cursor:pointer}
table.xt tbody tr:hover td{background:#f5faff}
.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(15,23,42,.18);padding:10px;width:260px;font-size:13px}
.pop input[type=text],.pop input[type=number],.pop input[type=date]{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.pop .lst{max-height:220px;overflow:auto;margin:6px 0;border:1px solid #eef2f7;border-radius:6px;padding:4px}
.pop .lst label{display:flex;gap:6px;align-items:center;padding:2px 4px;border-radius:4px}
.pop .lst label:hover{background:#f1f5f9}
.pop .lst .cnt{margin-left:auto;font-size:11px;color:var(--ink4)}
.pop .two{display:flex;gap:6px}.pop .two>div{flex:1}
.pop .ft{display:flex;gap:6px;justify-content:space-between;margin-top:8px}
/* ===== tooltip / modal / toast ===== */
#tip{position:fixed;z-index:80;pointer-events:none;background:#0f172a;color:#fff;font-size:12px;border-radius:8px;padding:8px 10px;max-width:320px;display:none;line-height:1.5;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .dlg{background:#fff;border-radius:14px;width:520px;max-width:100%;padding:18px;max-height:90vh;overflow:auto}
#modal label.f{display:block;font-size:12px;color:var(--ink3);margin:10px 0 3px}
#modal select,#modal input,#modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
#modal .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 16px;border-radius:10px;z-index:90;display:none}
/* ===== Mã lỗi + phương án ===== */
.codegrid{display:grid;grid-template-columns:repeat(8,minmax(150px,1fr));gap:8px;overflow-x:auto}
.codegrid .cg{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;min-width:150px}
.codegrid .cg h4{margin:0 0 6px;font-size:13px}
.codegrid .cg .it{font-size:12px;padding:3px 0;border-top:1px dashed #eef2f7}
.codegrid .cg .it b{color:#991b1b}
.codegrid .cg .it.a b{color:#9a3412}
.doc h3{margin-top:18px;color:#0b2545}
.doc ol,.doc ul{margin:6px 0 6px 20px;padding:0}
.doc li{margin:3px 0}
.doc table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.doc td,.doc th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.doc th{background:#f8fafc}
.note{background:#fffbea;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:13px}
.q{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">DVBH · Thiết kế lại trang Chi tiết ca bảo hành<small>Bản DEMO để Giám đốc duyệt — dữ liệu giả lập, chưa nối app thật</small></div>
  <nav id="nav">
    <button data-v="chitiet" class="on">① Chi tiết ca (mới)</button>
    <button data-v="ton">② Quản lý tồn theo bước</button>
    <button data-v="maloi">③ Danh mục mã lỗi theo bước</button>
    <button data-v="phuongan">④ Vấn đề &amp; phương án</button>
  </nav>
  <span class="demo-flag">DEMO</span>
</header>
<main>
  <section id="v-chitiet" class="on"></section>
  <section id="v-ton"></section>
  <section id="v-maloi"></section>
  <section id="v-phuongan"></section>
</main>
<div id="tip"></div>
<div id="modal"><div class="dlg" id="dlg"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ======================================================================
   1. ĐỊNH NGHĨA 8 BƯỚC + MÃ LỖI (đề xuất)
   ====================================================================== */
const NOW = new Date(2026, 10, 26, 10, 0);
const STEPS = [
  { n:1, k:"A", ten:"Khởi tạo",          the:"Thông tin ca chung", slaH:null, ai:"CSKH",          moTa:"CSKH tiếp nhận yêu cầu, tạo ca trên CRM/Odoo" },
  { n:2, k:"B", ten:"Xác nhận lịch hẹn", the:"Thông tin tóm lược", slaH:24,   ai:"KTV / Trạm",    moTa:"KTV liên hệ khách, chốt giờ hẹn (tính từ lúc tạo ca)" },
  { n:3, k:"C", ten:"Đặt linh kiện",     the:"Thông tin tóm lược", slaH:24,   ai:"KTV / Giám sát",moTa:"KTV kiểm tra, đặt đơn linh kiện (DDH) trên app Linh kiện" },
  { n:4, k:"D", ten:"Mua hàng",          the:"Thông tin tóm lược", slaH:72,   ai:"Mua hàng / Kho",moTa:"Kho xuất có sẵn, hoặc Mua hàng đặt PO nhà máy / NCC" },
  { n:5, k:"E", ten:"Giao LK cho KTV",   the:"Thông tin tóm lược", slaH:24,   ai:"Kho",           moTa:"Phiếu xuất kho (MISA) giao linh kiện cho KTV" },
  { n:6, k:"F", ten:"Đóng ca",           the:"Giải trình tồn",     slaH:24,   ai:"KTV / Trạm",    moTa:"Sửa chữa xong, báo cáo, đóng ca. Ca còn mở = giải trình tồn tại đây" },
  { n:7, k:"G", ten:"Trả xác 3T",        the:"Thông tin tóm lược", slaH:168,  ai:"KTV",           moTa:"KTV trả xác linh kiện đã thay về kho 3T" },
  { n:8, k:"H", ten:"Xác nhận xác",      the:"Thông tin tóm lược", slaH:72,   ai:"Kho / QC",      moTa:"Kho / QC kiểm, xác nhận xác đúng linh kiện đã cấp" },
];
const SLA_TONG_H = 72;
// nguon: "VP" = đang có trong danh mục vi phạm DVBH (Cài đặt → Loại vi phạm); "LD" = lấy từ lý do chậm Mua hàng; "MOI" = đề xuất mới
// tuDong: máy tự phát hiện từ dữ liệu (không cần người ghi)
const MA_LOI = [
  { ma:"A1", buoc:1, ten:"Tiếp nhận thiếu / sai thông tin khách, sản phẩm", nhom:"Lỗi báo cáo", diem:0.25, nguon:"MOI", tuDong:false },
  { ma:"A2", buoc:1, ten:"Sai nhóm / loại yêu cầu khi tạo ca", nhom:"Lỗi báo cáo", diem:0.25, nguon:"MOI", tuDong:false },
  { ma:"A3", buoc:1, ten:"Ca lặp (cùng serial, mở lại trong 30 ngày)", nhom:"Chất lượng", diem:0, nguon:"MOI", tuDong:true, quyTac:"Đã có ở tab Ca lặp — chuyển thành mã lỗi bước 1" },
  { ma:"B1", buoc:2, ten:"KTV chưa liên hệ", nhom:"Lỗi quy trình, sai hẹn, trang phục", diem:0.5, nguon:"VP", tuDong:false },

  themLoi(c, "B5", 2, addH(cr, 7), "Hệ thống", "3 lần hẹn", true);
  themLoi(c, "D1", 4, addH(cr, 30), "Mua hàng Hồng Nhung", "Bo mạch hết hàng tại nhà máy, nhà máy hẹn 25/11", false, "Đã chốt");
  c.sla72Step = 4;
  themLoi(c, "F10", 6, addH(cr, 72), "Hệ thống", `Vượt 72h lúc ${fmtT(addH(cr, 72))} — đang ở bước 4. Mua hàng`, true);
  c.gt = [
    { t: addH(cr, 26), buoc: 4, lyDo: "Do nhà máy hết hàng", duKien: addH(cr, 72), nd: "Bo mạch hết hàng, nhà máy hẹn 25/11", nguoi: "Giám sát Quốc Bảo" },
    { t: addH(cr, 82), buoc: 6, lyDo: "Chờ KTV lên lịch sửa", duKien: addH(cr, 100), nd: "Đã giao LK, hẹn khách 26/11 sáng", nguoi: "KTV Trần Minh Đức" },
  ];
  CASES.unshift(c);
})();

/* ======================================================================
   3. TRẠNG THÁI 1 BƯỚC
   ====================================================================== */
function trangThai(c, n) {
  if (c.skip.has(n)) return "skip";
  if (n === 1 || c.moc[n]) return "done";
  if (n === c.cur) return "cur";
  return "todo";
}
const tuoiTonH = c => ((c.closedAt && c.cur > 6 ? c.closedAt : NOW) - c.created) / 3600e3;
function mocTruoc(c, n) { for (let s = n - 1; s >= 1; s--) if (c.moc[s]) return c.moc[s]; return null; }
function loiBuoc(c, n) { return c.loi.filter(l => l.buoc === n); }
function loLKH(c) { const g = c.gt[c.gt.length - 1]; return !!(g && c.cur <= 6 && g.duKien < NOW); }

/* ======================================================================
   4. MÀN ① CHI TIẾT CA
   ====================================================================== */
let caId = CASES[0].id, moBuoc = null, moTatCa = false;
const getCa = () => CASES.find(c => c.id === caId);

function chipLoi(l) {
  const m = MA[l.ma] || { ten: l.ma };
  const cls = l.ma === "F10" ? "sla72" : l.tuDong ? "auto" : l.tt === "Đã bỏ" ? "bo" : "loi";
  const tip = `<b>${l.ma} · ${esc(m.ten)}</b><br>Bước ${l.buoc}. ${esc(STEPS[l.buoc - 1]?.ten || "")}<br>Nhóm: ${esc(m.nhom || "")}${m.diem ? " · " + m.diem + " điểm" : ""}<br>${l.tuDong ? "Máy tự phát hiện" : "Người ghi: " + esc(l.nguoi)} · ${fmtT(l.t)}<br>Trạng thái: ${esc(l.tt)}${l.ghiChu ? "<br>Ghi chú: " + esc(l.ghiChu) : ""}`;
  const nhan = l.ma === "F10" ? "⚑ Quá SLA 72h" : l.tuDong ? `${l.ma} · ${esc(m.ten.replace(/^Xác nhận lịch hẹn |^Đặt linh kiện |^Giao LK /, ""))}` : `Lỗi ${l.ma}`;
  return `<span class="chip ${cls}" data-tip="${esc(tip)}">${nhan}</span>`;
}

function metricsHTML(c, n) {
  const st = trangThai(c, n), out = [];
  const m = c.moc[n];
  if (st === "skip") return `<div class="m muted small">${n === 4 ? "Kho có sẵn, không cần mua" : "Ca không thay linh kiện"}</div>`;
  if (n === 1) { out.push(`<div class="m"><b>${fmtT(c.created)}</b></div>`, `<div class="m">${esc(c.moc[1].nguoi)}</div>`, `<div class="m">${esc(c.mucDo)} · ${esc(c.doiTac)}</div>`); }
  if (n === 2) {
    out.push(`<div class="m"><b>${c.lichHen.length} lần</b> hẹn</div>`);
    const d = m ? m.dur : st === "cur" ? c.waitH : null;
    if (d != null) out.push(`<div class="m"><b>${Math.round(d * 60)}p</b> ${m ? "tạo ca → chốt hẹn" : "đang chờ"}</div>`);
    const hen = c.lichHen[c.lichHen.length - 1]; if (hen && m) out.push(`<div class="m">Hẹn: ${fmtT(hen.hen)}</div>`);
  }
  if (n === 3 && c.lk) { out.push(`<div class="m"><b>${c.lk.items.length} mã LK</b> · ${esc(c.lk.ma)}</div>`); if (m) out.push(`<div class="m">${fmtDur(m.dur)} sau chốt hẹn</div>`); }
  if (n === 4 && c.po) { out.push(`<div class="m"><b>${esc(c.po.ma)}</b></div>`, `<div class="m">ETA ${fmtT(c.po.eta)}</div>`); if (c.po.lyDo) out.push(`<div class="m">${esc(c.po.lyDo)}</div>`); }
  if (n === 5) { if (c.pxk) out.push(`<div class="m">PXK <b>${esc(c.pxk.ma)}</b></div>`); else out.push(`<div class="m">Chờ kho xuất</div>`); }
  if (n === 6) {
    if (m) out.push(`<div class="m"><b>Hoàn thành</b></div>`, `<div class="m">Tổng ${fmtDur((m.t - c.created) / 3600e3)}</div>`);
    else if (st !== "todo") { out.push(`<div class="m"><b>${c.gt.length} lần GT</b></div>`); const g = c.gt[c.gt.length - 1]; if (g) out.push(`<div class="m">Dự kiến ${fmtT(g.duKien)}</div>`); if (loLKH(c)) out.push(`<span class="chip loi" data-tip="Ngày dự kiến của giải trình gần nhất đã qua mà ca chưa đóng">Lỡ kế hoạch</span>`); }
  }
  if (n === 7) { if (m) out.push(`<div class="m">Đã trả ${fmtT(m.t)}</div>`); else if (st === "cur") out.push(`<div class="m">Hạn: ${fmtT(addH(c.closedAt, 168))}</div>`); }
  if (n === 8) { if (m) out.push(`<div class="m"><b>Đúng LK</b></div>`); }
  const sla = STEPS[n - 1].slaH;
  if (sla && (m || st === "cur") && n !== 2) {
    const d = m ? m.dur : c.waitH;
    out.push(`<div class="m"><span class="chip ${d > sla ? "auto" : "ok"}" data-tip="SLA bước ${n}: ${fmtDur(sla)}">${d > sla ? "Quá" : "Trong"} SLA ${fmtDur(sla)}</span></div>`);
  }
  if (n === 2 && sla && (m || st === "cur")) { const d = m ? m.dur : c.waitH; if (d <= sla) out.push(`<div class="m"><span class="chip ok">Trong SLA 24h</span></div>`); }
  for (const l of loiBuoc(c, n)) if (!(l.ma === "F10")) out.push(`<div>${chipLoi(l)}</div>`);
  if (c.sla72Step === n) out.push(`<div>${chipLoi(c.loi.find(l => l.ma === "F10"))}</div>`);
  return out.join("");
}

function theHTML(c, n) {
  const st = trangThai(c, n), S = STEPS[n - 1], m = c.moc[n];
  if (st === "skip") return `<div class="scard skip">Bỏ qua</div>`;
  const L = [];
  if (n === 1) L.push(`${esc(c.kh)} · ${esc(c.sdt)}`, `${esc(c.nhom)} ${esc(c.hang)} ${esc(c.model)}`, `Lỗi báo: ${esc(c.hienTuong)}`, `KTV ${esc(c.ktv)} · ${esc(c.khuVuc)}`);
  if (n === 2) { const h = c.lichHen[c.lichHen.length - 1]; L.push(h ? `Lần cuối: ${esc(h.kq)}` : "Chưa liên hệ khách", h ? `Giờ hẹn: ${fmtT(h.hen)}` : "", `Người làm: KTV ${esc(c.ktv)}`); }
  if (n === 3) { if (c.lk) { L.push(`Đơn ${esc(c.lk.ma)}`, ...c.lk.items.slice(0, 2).map(x => "• " + esc(x.ten)), `TT: ${esc(c.lk.tt)}`); } else L.push("Chưa có đơn linh kiện"); }
  if (n === 4) { if (c.po) L.push(`${esc(c.po.ma)} · ${esc(c.po.ncc)}`, `Hàng về dự kiến ${fmtT(c.po.eta)}`, m ? `Đã về ${fmtT(m.t)}` : `Lý do chậm: ${esc(c.po.lyDo || "—")}`); else L.push("Chưa có PO"); }
  if (n === 5) L.push(c.pxk ? `PXK ${esc(c.pxk.ma)}` : "Chưa có phiếu xuất", m ? `Giao ${fmtT(m.t)}` : "", m ? esc(m.nguoi) : "");
  if (n === 6) {
    if (m) L.push(`Đóng ${fmtT(m.t)}`, `Kết quả: Hoàn thành XLSC`, `${c.gt.length} lần giải trình`);
    else { const g = c.gt[c.gt.length - 1]; L.push(g ? `Lý do: ${esc(g.lyDo)}` : "Chưa giải trình", g ? `Dự kiến xong ${fmtT(g.duKien)}` : "", g ? `GT bởi ${esc(g.nguoi)}` : ""); }
  }
  if (n === 7) L.push(m ? `Trả ${fmtT(m.t)}` : st === "cur" ? `Hạn trả ${fmtT(addH(c.closedAt, 168))}` : "Chưa tới", m ? `Phiếu TX-${c.id.slice(-5)}` : "");
  if (n === 8) L.push(m ? `Xác nhận ${fmtT(m.t)}` : st === "cur" ? "Chờ kho kiểm xác" : "Chưa tới", m ? "Kết quả: Đúng linh kiện" : "");
  const open = moBuoc === n;
  return `<div class="scard ${st}${open ? " open" : ""}" data-buoc="${n}">
    <div class="ti">${n}</div><div class="sub">${esc(S.the)}</div>
    ${L.filter(Boolean).map(x => `<div class="ln" title="${esc(x.replace(/<[^>]+>/g, ""))}">${x}</div>`).join("")}
    <div class="xem"><button data-act="mobuoc" data-buoc="${n}">${open ? "▴ Thu gọn" : "▾ Chi tiết"}</button></div></div>`;
}

function whenHTML(c, n) {
  const st = trangThai(c, n), m = c.moc[n];
  if (st === "skip") return `<div class="when">— không áp dụng —</div>`;
  if (st === "done") { const tr = mocTruoc(c, n); return `<div class="when"><div class="t">${fmtT(m.t)}</div>${n > 1 && tr ? `<div class="gap">+${fmtDur((m.t - tr.t) / 3600e3)}</div>` : ""}</div>`; }
  if (st === "cur") return `<div class="when">ĐANG Ở ĐÂY<br>chờ ${fmtDur(c.waitH)}</div>`;
  return `<div class="when">Chưa tới</div>`;
}

function panelBuoc(c, n) {
  const S = STEPS[n - 1], m = c.moc[n], st = trangThai(c, n);
  let body = "";
  if (n === 1) body = `<div class="kv">
    ${[["Mã ca", c.id], ["Khách hàng", c.kh], ["Điện thoại", c.sdt], ["Địa chỉ", c.diaChi], ["Sản phẩm", `${c.nhom} ${c.hang} ${c.model}`], ["Serial", c.serial], ["Hiện tượng lỗi", c.hienTuong],
       ["Nhóm / loại yêu cầu", `${c.nhomYc} — ${c.loaiYc}`], ["Mức độ", c.mucDo], ["Đối tác", c.doiTac], ["Khu vực", c.khuVuc], ["KTV triển khai", c.ktv], ["Tiếp nhận CSKH", fmtT(c.created) + " · " + c.moc[1].nguoi],
       ["Hạn SLA 72h", fmtT(addH(c.created, 72))], ["Tuổi tồn", fmtDur(tuoiTonH(c))]].map(([a, b]) => `<div><span>${a}</span>${esc(b)}</div>`).join("")}
    </div><p class="small muted">Thay cho tab "Thông tin" (3 kiểu xem 1/5/7 tab con) hiện nay — gộp thành 1 khối, trường ít dùng ẩn bằng nút ⚙ như cũ.</p>`;
  if (n === 2) body = `<table class="mini"><tr><th>#</th><th>Lúc liên hệ</th><th>Người</th><th>Giờ hẹn</th><th>Kết quả</th></tr>
    ${c.lichHen.map((h, i) => `<tr><td>${i + 1}</td><td>${fmtT(h.t)}</td><td>${esc(h.nguoi)}</td><td>${fmtT(h.hen)}</td><td>${esc(h.kq)}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">Chưa có lần liên hệ nào</td></tr>`}</table>
    <p class="small muted">Nguồn: lịch hẹn Odoo (tab con "Lịch hẹn" hiện nay). Thời gian chốt hẹn = lần có kết quả "KH xác nhận lịch".</p>`;
  if (n === 3) body = c.lk ? `<div class="kv"><div><span>Đơn đặt LK</span>${esc(c.lk.ma)}</div><div><span>Trạng thái mới nhất (theo phiếu)</span>${esc(c.lk.tt)}</div><div><span>Ngày đặt</span>${m ? fmtT(m.t) : "—"}</div></div>
    <table class="mini"><tr><th>Mã LK</th><th>Tên linh kiện</th><th>SL</th></tr>${c.lk.items.map(x => `<tr><td>${x.ma}</td><td>${esc(x.ten)}</td><td>${x.sl}</td></tr>`).join("")}</table>
    <p class="small muted">Nguồn: app Đặt linh kiện (tab "Mua hàng" hiện nay).</p>` : `<p class="muted">Chưa có đơn linh kiện.</p>`;
  if (n === 4) body = c.po ? `<div class="kv"><div><span>PO</span>${esc(c.po.ma)}</div><div><span>Nhà cung cấp</span>${esc(c.po.ncc)}</div><div><span>Hàng về dự kiến</span>${fmtT(c.po.eta)}</div><div><span>Hàng về thực tế</span>${m ? fmtT(m.t) : "Chưa về"}</div><div><span>Lý do chậm</span>${esc(c.po.lyDo || "—")}</div></div>
    <p class="small muted">Gộp tab "PO đặt hàng" + "Thiếu hàng" hiện nay.</p>` : `<p class="muted">Chưa có PO.</p>`;
  if (n === 5) body = `<div class="kv"><div><span>Phiếu xuất kho (MISA)</span>${c.pxk ? esc(c.pxk.ma) : "—"}</div><div><span>Ngày giao</span>${m ? fmtT(m.t) : "—"}</div><div><span>Người giao</span>${m ? esc(m.nguoi) : "—"}</div><div><span>KTV nhận</span>${esc(c.ktv)}</div></div>`;
  if (n === 6) body = `<div class="row"><b>Lịch sử giải trình tồn (${c.gt.length})</b>${c.cur <= 6 ? `<button class="btn pri sm" data-act="giaitrinh">✍ Giải trình tồn</button>` : ""}</div>
    <table class="mini"><tr><th>Lúc</th><th>Bước bị kẹt</th><th>Lý do</th><th>Dự kiến xong</th><th>Nội dung</th><th>Người</th></tr>
    ${c.gt.slice().reverse().map(g => `<tr><td>${fmtT(g.t)}</td><td><span class="badge b-ocean">${g.buoc}. ${esc(STEPS[g.buoc - 1].ten)}</span></td><td>${esc(g.lyDo)}</td><td>${fmtT(g.duKien)}${g.duKien < NOW && c.cur <= 6 && g === c.gt[c.gt.length - 1] ? ' <span class="chip loi">Lỡ KH</span>' : ""}</td><td>${esc(g.nd)}</td><td>${esc(g.nguoi)}</td></tr>`).join("") || `<tr><td colspan="6" class="muted">Chưa có giải trình</td></tr>`}</table>
    <p class="small muted">Mới: mỗi lần giải trình ghi kèm "bước đang kẹt" → Quản lý tồn biết ca kẹt ở khâu nào. Sửa chữa bảo hành (tab "Bảo hành"), biên bản họp cũng gom về đây.</p>`;
  if (n === 7) body = `<div class="kv"><div><span>Hạn trả xác</span>${c.closedAt ? fmtT(addH(c.closedAt, 168)) : "Sau khi đóng ca 7 ngày"}</div><div><span>Ngày trả</span>${m ? fmtT(m.t) : "—"}</div><div><span>Phiếu trả xác</span>${m ? "TX-" + c.id.slice(-5) : "—"}</div></div><p class="note small">Bước mới — DVBH hiện CHƯA có dữ liệu trả xác. Cần lấy từ app Linh kiện / kho (xem tab ④).</p>`;
  if (n === 8) body = `<div class="kv"><div><span>Người xác nhận</span>${m ? esc(m.nguoi) : "—"}</div><div><span>Kết quả</span>${m ? "Đúng linh kiện đã cấp" : "—"}</div></div><p class="note small">Bước mới — chưa có dữ liệu (xem tab ④).</p>`;
  const lois = loiBuoc(c, n);
  return `<div class="panel"><h3><span class="badge b-ocean">Bước ${n}</span>${esc(S.ten)} <span class="small muted">· ${esc(S.moTa)} · Phụ trách: ${esc(S.ai)}${S.slaH ? " · SLA " + fmtDur(S.slaH) : ""}</span>
    <button class="btn sm" style="margin-left:auto" data-act="mobuoc" data-buoc="${n}">▴ Thu gọn</button></h3>${body}
    <div style="margin-top:12px"><div class="row"><b>Mã lỗi của bước này (${lois.length})</b><button class="btn warn sm" data-act="ghiloi" data-buoc="${n}">⚠ Ghi nhận lỗi bước ${n}</button></div>
    ${lois.length ? `<table class="mini"><tr><th>Mã</th><th>Tên lỗi</th><th>Ghi bởi</th><th>Lúc</th><th>Trạng thái</th><th>Ghi chú</th><th></th></tr>${lois.map((l, i) => `<tr><td>${chipLoi(l)}</td><td>${esc(MA[l.ma].ten)}</td><td>${l.tuDong ? "Máy tự phát hiện" : esc(l.nguoi)}</td><td>${fmtT(l.t)}</td><td>${esc(l.tt)}</td><td>${esc(l.ghiChu)}</td><td>${!l.tuDong && l.tt === "Chờ QC chốt" ? `<button class="btn sm" data-act="chot" data-idx="${c.loi.indexOf(l)}">QC chốt</button> <button class="btn sm" data-act="bo" data-idx="${c.loi.indexOf(l)}">Bỏ</button>` : ""}</td></tr>`).join("")}</table>` : `<p class="muted small">Không có lỗi.</p>`}</div></div>`;
}

function nhatKy(c) {
  const ev = [];
  for (const s of STEPS) { const m = c.moc[s.n]; if (m) ev.push({ t: m.t, cls: "", txt: `<b>${s.n}. ${esc(s.ten)}</b> — xong · ${esc(m.nguoi)}` }); }
  for (const h of c.lichHen) ev.push({ t: h.t, cls: "", txt: `Liên hệ khách: ${esc(h.kq)} (hẹn ${fmtT(h.hen)}) · ${esc(h.nguoi)}` });
  for (const g of c.gt) ev.push({ t: g.t, cls: "gt", txt: `Giải trình tồn [bước ${g.buoc}]: ${esc(g.lyDo)} — dự kiến ${fmtT(g.duKien)} · ${esc(g.nguoi)}` });
  for (const l of c.loi) ev.push({ t: l.t, cls: "loi", txt: `Lỗi ${l.ma} [bước ${l.buoc}]: ${esc(MA[l.ma].ten)} · ${l.tuDong ? "máy tự phát hiện" : esc(l.nguoi)}` });
  ev.sort((a, b) => b.t - a.t);
  return `<div class="vlog">${ev.map(e => `<div class="e ${e.cls}"><div class="tt">${fmtT(e.t)}</div>${e.txt}</div>`).join("")}</div>`;
}

function renderChiTiet() {
  const c = getCa(), el = document.getElementById("v-chitiet");
  const tong = tuoiTonH(c), quaSla = tong > SLA_TONG_H;
  const ttCa = c.cur <= 6 ? `<span class="badge b-amber">Đang tồn · ${fmtDur(tong)}</span>` : c.cur <= 8 ? `<span class="badge b-violet">Đã đóng ca · còn tồn xác</span>` : `<span class="badge b-teal">Đã xong cả 8 bước</span>`;
  const opts = CASES.map(x => `<option value="${x.id}" ${x.id === c.id ? "selected" : ""}>${x.id} · ${esc(x.kh)} · bước ${Math.min(x.cur, 8)}${x.cur > 8 ? " (xong)" : ""}</option>`).join("");
  const cur = c.cur <= 8 ? STEPS[c.cur - 1] : null;
  el.innerHTML = `
  <div class="picker"><b>Chọn ca demo:</b><input id="tim" type="text" placeholder="Gõ mã ca / tên khách…"><select id="chonCa">${opts}</select>
    <button class="btn sm" data-act="ca" data-d="-1">◀ Ca trước</button><button class="btn sm" data-act="ca" data-d="1">Ca sau ▶</button>
    <span class="small muted">Ca đầu tiên dựng đúng theo bản vẽ Excel của Giám đốc (hẹn 3 lần, lỗi B1, B2, 420p, quá SLA 72h).</span></div>
  <div class="box">
    <div class="chead">
      <div><div class="id">${c.id} ${ttCa} ${quaSla ? `<span class="badge b-pink">⚑ Quá SLA 72h</span>` : `<span class="badge b-teal">Trong SLA 72h</span>`} <span class="badge ${c.mucDo === "Thường" ? "" : "b-red"}">${c.mucDo}</span></div>

   5. BẢNG KIỂU EXCEL DÙNG CHUNG (lọc + sắp xếp trên tiêu đề cột)

const XT = {}; // trạng thái theo id bảng
function xtState(id) { return XT[id] || (XT[id] = { sort: null, f: {} }); }
function xtVal(col, r) { return col.get ? col.get(r) : r[col.key]; }
function xtActive(col, f) {
  if (!f) return false;
  if (col.type === "multi") return f.size > 0;
  if (col.type === "text") return !!f.trim();
  return f.from !== "" && f.from != null || f.to !== "" && f.to != null;
}
function xtPass(col, f, r) {
  if (!xtActive(col, f)) return true;
  const v = xtVal(col, r);
  if (col.type === "text") return boDau(v).includes(boDau(f.trim()));
  if (col.type === "multi") { const arr = Array.isArray(v) ? v : [v]; return arr.some(x => f.has(String(x))); }
  if (col.type === "num") { const n = Number(v); return (f.from === "" || n >= Number(f.from)) && (f.to === "" || n <= Number(f.to)); }
  if (col.type === "date") { const d = v ? fmtISO(v) : ""; return (!f.from || d >= f.from) && (!f.to || d <= f.to); }
  return true;
}
const fmtISO = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
function xtRender(host, id, cols, rows, onRow) {
  const s = xtState(id);
  let out = rows.filter(r => cols.every(c => xtPass(c, s.f[c.key], r)));
  if (s.sort) {
    const col = cols.find(c => c.key === s.sort.key), dir = s.sort.dir;
    out = out.slice().sort((a, b) => {
      let x = xtVal(col, a), y = xtVal(col, b);
      if (Array.isArray(x)) x = x.join(","); if (Array.isArray(y)) y = y.join(",");
      if (x instanceof Date) x = +x; if (y instanceof Date) y = +y;
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      return String(x ?? "").localeCompare(String(y ?? ""), "vi") * dir;
    });
  }
  const nAct = cols.filter(c => xtActive(c, s.f[c.key])).length;
  host.innerHTML = `<div class="xt-bar"><b>${out.length}</b>&nbsp;/ ${rows.length} dòng${nAct ? ` · đang lọc ${nAct} cột <button class="btn sm" data-xt="clearall">✕ Xoá tất cả lọc</button>` : ""}<span class="small muted">Bấm tiêu đề cột để sắp xếp · ⏷ để lọc · bấm dòng để mở chi tiết ca</span></div>
  <div class="xt-wrap"><table class="xt"><thead><tr>${cols.map(c => {
    const act = xtActive(c, s.f[c.key]), ar = s.sort && s.sort.key === c.key ? (s.sort.dir > 0 ? "▲" : "▼") : "";
    return `<th class="${act ? "act" : ""}"><div class="hw"><span class="lb" data-xt="sort" data-k="${c.key}">${esc(c.label)}<span class="ar">${ar}</span></span>${act ? `<button class="x" title="Xoá lọc cột này" data-xt="clear" data-k="${c.key}">✕</button>` : ""}<button class="fb" title="Lọc" data-xt="pop" data-k="${c.key}">⏷</button></div></th>`;
  }).join("")}</tr></thead><tbody>${out.map((r, i) => `<tr data-i="${rows.indexOf(r)}">${cols.map(c => `<td>${c.render ? c.render(r) : esc(xtVal(c, r))}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${cols.length}" class="muted" style="text-align:center;padding:20px">Không có dòng nào khớp bộ lọc</td></tr>`}</tbody></table></div>`;
  host.onclick = e => {
    const t = e.target.closest("[data-xt]");
    if (t) {
      e.stopPropagation();
      const k = t.dataset.k, a = t.dataset.xt;
      if (a === "sort") { s.sort = s.sort && s.sort.key === k ? (s.sort.dir > 0 ? { key: k, dir: -1 } : null) : { key: k, dir: 1 }; xtRender(host, id, cols, rows, onRow); }
      if (a === "clear") { delete s.f[k]; xtRender(host, id, cols, rows, onRow); }
      if (a === "clearall") { s.f = {}; xtRender(host, id, cols, rows, onRow); }
      if (a === "pop") xtPop(t, host, id, cols, rows, onRow, cols.find(c => c.key === k));
      return;
    }
    const tr = e.target.closest("tbody tr[data-i]");
    if (tr && onRow) onRow(rows[+tr.dataset.i]);
  };
}
let popEl = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; } }
function xtPop(btn, host, id, cols, rows, onRow, col) {
  closePop();
  const s = xtState(id), rr = btn.getBoundingClientRect();
  popEl = document.createElement("div"); popEl.className = "pop";
  popEl.style.top = Math.min(rr.bottom + 4, innerHeight - 340) + "px"; popEl.style.left = Math.max(8, Math.min(rr.left - 220, innerWidth - 270)) + "px";
  const redraw = () => xtRender(host, id, cols, rows, onRow);
  if (col.type === "text") {
    popEl.innerHTML = `<b>Tìm trong "${esc(col.label)}"</b><div class="small muted">Không phân biệt dấu / hoa thường</div><input type="text" value="${esc(s.f[col.key] || "")}" placeholder="Gõ từ cần tìm…">`;
    const inp = popEl.querySelector("input"); inp.oninput = () => { s.f[col.key] = inp.value; redraw(); };
    setTimeout(() => inp.focus(), 0);
  } else if (col.type === "multi") {
    // đếm giá trị trên tập đã lọc bởi các cột KHÁC
    const base = rows.filter(r => cols.every(c => c === col || xtPass(c, s.f[c.key], r)));
    const cnt = new Map();
    for (const r of base) { const v = xtVal(col, r); for (const x of (Array.isArray(v) ? v : [v])) cnt.set(String(x), (cnt.get(String(x)) || 0) + 1); }
    for (const r of rows) { const v = xtVal(col, r); for (const x of (Array.isArray(v) ? v : [v])) if (!cnt.has(String(x))) cnt.set(String(x), 0); }
    const vals = [...cnt.keys()].sort((a, b) => (col.order ? col.order(a) - col.order(b) : a.localeCompare(b, "vi")));
    const sel = s.f[col.key] || new Set();
    popEl.innerHTML = `<b>Lọc "${esc(col.label)}"</b><div class="small muted">Chọn nhiều = khớp 1 giá trị bất kỳ · không tick = không lọc</div><input type="text" placeholder="Tìm giá trị…"><div class="lst">${vals.map(v => `<label data-v="${esc(v)}"><input type="checkbox" value="${esc(v)}" ${sel.has(v) ? "checked" : ""}> <span>${esc(v)}</span><span class="cnt">${cnt.get(v)}</span></label>`).join("")}</div>
      <div class="ft"><button class="btn sm" data-a="all">Chọn tất cả</button><button class="btn sm" data-a="none">Bỏ chọn</button><button class="btn sm pri" data-a="close">Xong</button></div>`;
    const sync = () => { const ns = new Set([...popEl.querySelectorAll(".lst input:checked")].map(x => x.value)); s.f[col.key] = ns; redraw(); };
    popEl.querySelectorAll(".lst input").forEach(x => x.onchange = sync);
    popEl.querySelector("input[type=text]").oninput = e => { const q = boDau(e.target.value); popEl.querySelectorAll(".lst label").forEach(l => l.style.display = boDau(l.dataset.v).includes(q) ? "" : "none"); };
    popEl.querySelector("[data-a=all]").onclick = () => { popEl.querySelectorAll(".lst label").forEach(l => { if (l.style.display !== "none") l.querySelector("input").checked = true; }); sync(); };
    popEl.querySelector("[data-a=none]").onclick = () => { popEl.querySelectorAll(".lst input").forEach(x => x.checked = false); sync(); };
    popEl.querySelector("[data-a=close]").onclick = closePop;
  } else {
    const f = s.f[col.key] || { from: "", to: "" }, typ = col.type === "date" ? "date" : "number";
    popEl.innerHTML = `<b>${col.type === "date" ? "Khoảng ngày" : "Khoảng giá trị"} "${esc(col.label)}"</b><div class="two" style="margin-top:6px"><div><span class="small muted">Từ</span><input type="${typ}" data-a="from" value="${f.from}"></div><div><span class="small muted">Đến</span><input type="${typ}" data-a="to" value="${f.to}"></div></div>
      ${col.type === "date" ? `<div class="small muted" style="margin-top:4px">Chọn 1 ngày: điền cùng 1 ngày ở cả 2 ô</div>` : ""}<div class="ft"><button class="btn sm" data-a="clr">Xoá</button><button class="btn sm pri" data-a="close">Xong</button></div>`;
    const sync = () => { s.f[col.key] = { from: popEl.querySelector("[data-a=from]").value, to: popEl.querySelector("[data-a=to]").value }; redraw(); };
    popEl.querySelectorAll("input").forEach(x => x.oninput = sync);
    popEl.querySelector("[data-a=clr]").onclick = () => { delete s.f[col.key]; closePop(); redraw(); };
    popEl.querySelector("[data-a=close]").onclick = closePop;
  }
  document.body.appendChild(popEl);
}
document.addEventListener("mousedown", e => { if (popEl && !popEl.contains(e.target) && !e.target.closest("[data-xt=pop]")) closePop(); });

      <div class="box"><h3>Tất cả ca tồn</h3><div id="xtHost"></div></div>`;
  } else if (tonView === "loi") {

  } else {
    const n = +tonView, S = STEPS[n - 1], d = dem(n), hot = d.filter(quaSlaBuoc).length, coLoi = d.filter(c => c.loi.some(l => l.buoc === n && l.tt !== "Đã bỏ")).length;
    const tb = d.length ? d.reduce((a, c) => a + c.waitH, 0) / d.length : 0;
    main = `<div class="box"><h2>Bước ${n}. ${esc(S.ten)} <span class="small muted">· ${esc(S.moTa)} · Phụ trách: ${esc(S.ai)}</span></h2>

      <div class="row small muted" style="margin-bottom:4px">Mã lỗi của bước: ${MA_LOI.filter(m => m.buoc === n).map(m => `<span class="chip ${m.tuDong ? "auto" : "loi"}" data-tip="${esc(m.ten)}">${m.ma}</span>`).join(" ") || "—"}</div>
      <div id="xtHost"></div></div>`;
  }
  el.innerHTML = `<div class="tonlayout">${side}<div>${main}</div></div>`;
  const host = document.getElementById("xtHost");
  if (host) {
    const rows = tonView === "tong" ? ton : tonView === "loi" ? ton.filter(c => c.loi.some(l => l.tt !== "Đã bỏ")) : dem(+tonView);
    const cols = tonView === "tong" || tonView === "loi" ? cotChung() : cotChung().filter(c => c.key !== "buoc").concat(cotRieng(+tonView));
    xtRender(host, "ton-" + tonView, cols, rows, r => moCa(r.id));
  }
}

    const b = +document.getElementById("mBuoc").value;

  };
  const bb = () => { document.getElementById("bb").textContent = document.getElementById("mMa").value === "X1" ? "(bắt buộc với Lỗi khác)" : ""; };
  document.getElementById("mBuoc").onchange = fill; fill(); document.getElementById("mMa").onchange = bb;
  document.querySelector("[data-m=huy]").onclick = dongModal;
  document.querySelector("[data-m=luu]").onclick = () => {
    const b = +document.getElementById("mBuoc").value, ma = document.getElementById("mMa").value, gc = document.getElementById("mGc").value.trim();
    if (ma === "X1" && !gc) { toast("Lỗi khác bắt buộc nhập ghi chú"); return; }
    if (c.loi.some(l => l.ma === ma && l.buoc === b && l.tt !== "Đã bỏ")) { toast(`Ca này đã có lỗi ${ma} ở bước ${b}`); return; }
    c.loi.push({ ma, buoc: b, t: new Date(NOW), nguoi: "QC (bạn đang demo)", ghiChu: gc, tuDong: false, tt: "Chờ QC chốt" });
    dongModal(); moBuoc = b; renderChiTiet(); toast(`Đã ghi nhận lỗi ${ma} vào bước ${b}. ${STEPS[b - 1].ten}`);
  };
}
function moGiaiTrinh() {
  const c = getCa(), b0 = Math.min(c.cur, 6);
  const toIso = d => `${fmtISO(d)}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
  modal(`<h3>✍ Giải trình tồn — ca ${c.id}</h3>
    <label class="f">Ca đang kẹt ở bước (mới — để Quản lý tồn chia theo bước)</label><select id="gBuoc">${STEPS.slice(1, 6).filter(S => !c.skip.has(S.n)).map(S => `<option value="${S.n}" ${S.n === b0 ? "selected" : ""}>${S.n}. ${esc(S.ten)}</option>`).join("")}</select>
    <label class="f">Lý do (lọc theo bước)</label><select id="gLy"></select>
    <label class="f">Ngày dự kiến hoàn thành</label><input id="gDk" type="datetime-local" value="${toIso(addH(NOW, 24))}">
    <label class="f">Nội dung</label><textarea id="gNd" rows="3"></textarea>
    <div class="ft"><button class="btn" data-m="huy">Huỷ</button><button class="btn pri" data-m="luu">Lưu giải trình</button></div>`);
  const fill = () => { const b = +document.getElementById("gBuoc").value; document.getElementById("gLy").innerHTML = (LYDO_GT[b] || []).concat(["Lý do khác"]).map(x => `<option>${esc(x)}</option>`).join(""); };
  document.getElementById("gBuoc").onchange = fill; fill();
  document.querySelector("[data-m=huy]").onclick = dongModal;
  document.querySelector("[data-m=luu]").onclick = () => {
    const dk = new Date(document.getElementById("gDk").value);
    if (isNaN(dk) || dk <= NOW) { toast("Ngày dự kiến phải sau thời điểm hiện tại"); return; }
    const ly = document.getElementById("gLy").value, nd = document.getElementById("gNd").value.trim();
    if (ly === "Lý do khác" && !nd) { toast("Lý do khác bắt buộc nhập nội dung"); return; }
    c.gt.push({ t: new Date(NOW), buoc: +document.getElementById("gBuoc").value, lyDo: ly, duKien: dk, nd: nd || ly, nguoi: "Bạn (demo)" });
    dongModal(); moBuoc = 6; renderChiTiet(); toast("Đã lưu giải trình tồn");
  };
}

/* ======================================================================
   10. ĐIỀU HƯỚNG + SỰ KIỆN CHUNG
   ====================================================================== */
let view = "chitiet";
function doiView(v) {
  view = v;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  closePop();
  ({ chitiet: renderChiTiet, ton: renderTon, maloi: renderMaLoi, phuongan: renderPhuongAn })[v]();
  scrollTo(0, 0);
}
document.getElementById("nav").onclick = e => { const b = e.target.closest("button"); if (b) doiView(b.dataset.v); };
let tId;
function toast(s) { const t = document.getElementById("toast"); t.textContent = s; t.style.display = "block"; clearTimeout(tId); tId = setTimeout(() => t.style.display = "none", 2600); }

document.getElementById("v-chitiet").addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, c = getCa();
  if (act === "mobuoc") { const n = +a.dataset.buoc; if (c.skip.has(n)) { toast("Bước này bỏ qua với ca này"); return; } moBuoc = moBuoc === n ? null : n; renderChiTiet(); if (moBuoc) document.querySelector(".panel")?.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  if (act === "tatca") { moTatCa = !moTatCa; renderChiTiet(); }
  if (act === "ghiloi") moGhiLoi(a.dataset.buoc ? +a.dataset.buoc : null);
  if (act === "giaitrinh") moGiaiTrinh();
  if (act === "crm") toast("Demo: mở ca trên CRM ở tab mới");
  if (act === "ca") { const i = CASES.findIndex(x => x.id === caId), j = (i + +a.dataset.d + CASES.length) % CASES.length; caId = CASES[j].id; moBuoc = null; renderChiTiet(); }
  if (act === "chot" || act === "bo") { const l = c.loi[+a.dataset.idx]; l.tt = act === "chot" ? "Đã chốt" : "Đã bỏ"; renderChiTiet(); toast(act === "chot" ? `QC đã chốt lỗi ${l.ma}` : `QC đã bỏ lỗi ${l.ma}`); }
});
document.getElementById("v-chitiet").addEventListener("change", e => { if (e.target.id === "chonCa") { caId = e.target.value; moBuoc = null; renderChiTiet(); } });
document.getElementById("v-chitiet").addEventListener("input", e => {
  if (e.target.id !== "tim") return;
  const q = boDau(e.target.value), sel = document.getElementById("chonCa");
  let first = null;
  [...sel.options].forEach(o => { const ok = boDau(o.text).includes(q); o.hidden = !ok; if (ok && !first) first = o; });
  if (first && q) { caId = first.value; moBuoc = null; const v = e.target.value; renderChiTiet(); const inp = document.getElementById("tim"); inp.value = v; inp.focus(); inp.setSelectionRange(v.length, v.length); }
});
document.getElementById("v-ton").addEventListener("click", e => {
  const b = e.target.closest("[data-tv]");
  if (b) { if (b.dataset.tv === "cu") { toast("Màn cũ giữ nguyên như app hiện tại (không dựng lại trong demo)"); return; } tonView = b.dataset.tv; renderTon(); return; }
  const m = e.target.closest("[data-mx]");
  if (m) { const [n, kv] = m.dataset.mx.split("|"); tonView = n; xtState("ton-" + n).f = { khuVuc: new Set([kv]) }; renderTon(); toast(`Bước ${n} · đã lọc sẵn khu vực ${kv}`); }
});
// tooltip
const tip = document.getElementById("tip");
document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); if (!t) { tip.style.display = "none"; return; } tip.innerHTML = t.dataset.tip; tip.style.display = "block"; });
document.addEventListener("mousemove", e => { if (tip.style.display !== "block") return; const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + "px"; tip.style.top = (e.clientY + 16 + h > innerHeight ? e.clientY - h - 10 : e.clientY + 16) + "px"; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { dongModal(); closePop(); } });

renderChiTiet();
</script>
</body>
</html>
