<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#052033">
<title>DEMO v2 — Chi tiết ca bảo hành theo 8 bước quy trình</title>
<style>
/* Bảng màu lấy đúng từ app thật (frontend/src/styles/tokens.css) để mẫu khớp khi code vào app */
:root{
  --ocean-950:#052033;--ocean-900:#06304a;--ocean-800:#0a4666;--ocean-700:#0e5d85;--ocean-600:#1176a6;--ocean-500:#1591c9;--ocean-400:#3fb0e0;--ocean-100:#ddf1fb;
  --teal-600:#0f7d74;--teal-500:#159c93;--teal-100:#dcf5f2;
  --amber-700:#8a5810;--amber-600:#b3730f;--amber-500:#d98a1f;--amber-100:#fbebd1;
  --coral-600:#b23a3a;--coral-500:#d84c4c;--coral-400:#e78888;--coral-100:#fbe1e1;
  --orange-700:#9a3412;--orange-500:#ea580c;--orange-100:#ffedd5;
  --violet-700:#5b21b6;--violet-600:#7c3aed;--violet-100:#ede9fe;
  --pink-700:#9d174d;--pink-100:#fce7f3;
  --bg:#f2f6f9;--surface:#fff;--surface-100:#f5f8fa;--surface-200:#e9eff3;--line:#e1eaf0;--line2:#cfdbe4;
  --ink-900:#0f2536;--ink-700:#24374a;--ink-600:#4c6478;--ink-500:#62798c;--ink-400:#8ca0af;
  --rail:#d3dee6;--toph:56px;
  --shadow:0 1px 2px rgba(15,37,54,.06),0 1px 3px rgba(15,37,54,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 "Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink-900);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink-900)}
b,strong{font-weight:650}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-500)}.small{font-size:12px}
h2{font-size:17px;line-height:1.35;margin:0 0 4px;font-weight:700}
h3{font-size:14.5px;line-height:1.35;margin:0 0 8px;font-weight:700}

/* ===== Thanh trên ===== */
.top{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,var(--ocean-950),var(--ocean-800));color:#fff;box-shadow:0 2px 10px rgba(5,32,51,.25)}
.top-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:0 18px;min-height:56px;position:relative}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:32px;height:32px;border-radius:9px;background:var(--ocean-500);display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.02em}
.brand b{display:block;font-size:14px;line-height:1.25}
.brand small{display:block;font-size:11px;color:rgba(255,255,255,.62);line-height:1.3}
#nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:none;background:none;border:0;color:rgba(255,255,255,.76);padding:0 14px;height:56px;border-bottom:3px solid transparent;font-weight:500;white-space:nowrap}
#nav button:hover{color:#fff}
#nav button.on{color:#fff;border-bottom-color:var(--ocean-400);font-weight:700}
.demo-flag{flex:none;background:var(--amber-500);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.03em}
main{padding:16px 18px 64px;max-width:1480px;margin:0 auto}
section{display:none}section.on{display:block}

/* ===== Thành phần chung ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;border:1px solid var(--line2);background:#fff;border-radius:9px;padding:5px 13px;color:var(--ink-700);font-weight:550;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-100)}
.btn:focus-visible,.chip:focus-visible,#nav button:focus-visible{outline:2px solid var(--ocean-400);outline-offset:2px}
.btn.pri{background:var(--ocean-600);border-color:var(--ocean-600);color:#fff}.btn.pri:hover{background:var(--ocean-700)}
.btn.warn{border-color:#efb3b3;color:var(--coral-600)}.btn.warn:hover{background:var(--coral-100)}
.btn.ghost{border-color:transparent;background:none;color:var(--ocean-600)}.btn.ghost:hover{background:var(--ocean-100)}
.btn.sm{min-height:28px;padding:2px 9px;font-size:12.5px;border-radius:7px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;line-height:1.5;padding:1px 9px;border-radius:999px;background:var(--surface-200);color:var(--ink-700);white-space:nowrap}
.b-amber{background:var(--amber-100);color:var(--amber-700)}.b-teal{background:var(--teal-100);color:var(--teal-600)}.b-red{background:var(--coral-100);color:var(--coral-600)}
.b-ocean{background:var(--ocean-100);color:var(--ocean-700)}.b-pink{background:var(--pink-100);color:var(--pink-700)}.b-violet{background:var(--violet-100);color:var(--violet-700)}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;line-height:1.55;padding:0 7px;border-radius:6px;border:1px solid;width:max-content;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;background:none}
.chip[data-tip]{cursor:help}
.chip.loi{background:var(--coral-100);border-color:#f0b4b4;color:var(--coral-600)}
.chip.auto{background:var(--orange-100);border-color:#fdc195;color:var(--orange-700)}
.chip.sla72{background:var(--pink-100);border-color:#f5b1d0;color:var(--pink-700)}
.chip.ok{background:var(--teal-100);border-color:#9fdcd5;color:var(--teal-600)}
.chip.bo{background:var(--surface-100);border-color:var(--line2);color:var(--ink-400);text-decoration:line-through}
.chip.gt{background:var(--violet-100);border-color:#d3c4fb;color:var(--violet-700)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.mini{border-collapse:collapse;width:100%;font-size:13px}
table.mini th,table.mini td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.mini th{background:var(--surface-100);font-size:12px;color:var(--ink-500);font-weight:600;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px}
.kv>div{font-size:13.5px;min-width:0;overflow-wrap:anywhere}.kv span{display:block;font-size:11.5px;color:var(--ink-500);margin-bottom:1px}
.note{background:#fff8ea;border:1px solid #f3d9a8;border-radius:10px;padding:9px 12px;font-size:13px;color:var(--amber-700)}
.empty{color:var(--ink-400);font-size:13px;font-style:italic;padding:4px 0}
.pc-only{display:block}.mo-only{display:none}

/* ===== ① Chi tiết ca ===== */
.picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
.picker input,.picker select{border:1px solid var(--line2);border-radius:9px;padding:6px 10px;background:#fff;min-height:34px}
.picker input{width:220px}.picker select{max-width:440px;min-width:0}
.hdr{display:flex;gap:16px 20px;align-items:flex-start}
.hl{flex:1;min-width:0}
.idrow{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.cid{font-size:20px;font-weight:800;letter-spacing:.01em;margin-right:4px;font-variant-numeric:tabular-nums}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 18px;margin-top:10px}
.meta>div{min-width:0}.meta span{display:block;font-size:11.5px;color:var(--ink-500)}
.meta b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.fhead{display:flex;gap:12px 24px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ftitle{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400)}
.fsub{font-size:14px;margin-top:2px}.fsub b{color:var(--amber-600)}
.slabar{margin-left:auto;min-width:260px}
.sl-l{font-size:12px;color:var(--ink-600);display:flex;justify-content:space-between;gap:10px}
.sl-b{position:relative;height:8px;border-radius:99px;background:var(--surface-200);margin-top:4px;overflow:hidden}
.sl-b i{display:block;height:100%;border-radius:99px}
/* luồng ngang PC — mỗi cột 1 bước, 5 hàng thẳng nhau như bản vẽ Excel */
.flow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:auto auto auto auto}
.col{display:grid;grid-row:span 4;grid-template-rows:subgrid;padding:0 5px;min-width:0}
.shead{display:flex;align-items:baseline;gap:5px;min-height:38px;font-size:13px;line-height:1.3}
.shead .no{font-size:11.5px;color:var(--ink-400);font-weight:700;flex:none}
.shead .nm{font-weight:700}
.col.skip .shead .nm{color:var(--ink-400)}
.rail{position:relative;height:36px;display:flex;align-items:center;justify-content:center}
.rail::before{content:"";position:absolute;top:50%;height:4px;margin-top:-2px;left:-5px;right:-5px;background:var(--rail)}
.col:first-child .rail::before{left:50%}.col:last-child .rail::before{right:50%}
.col.done .rail::before{background:var(--teal-500)}
.col.cur .rail::before{background:linear-gradient(90deg,var(--teal-500) 50%,var(--rail) 50%)}
.col.skip .rail::before{background:repeating-linear-gradient(90deg,#bccbd6 0 6px,transparent 6px 11px)}
.dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #bccbd6;background:#fff;color:var(--ink-400);cursor:pointer;flex:none}
.done .dot{background:var(--teal-500);border-color:var(--teal-500);color:#fff}
.cur .dot{background:var(--amber-500);border-color:var(--amber-500);color:#fff;width:34px;height:34px;animation:pulse 1.8s infinite}
.skip .dot{border-style:dashed;background:var(--surface-100)}
.hasbad .dot::after{content:"!";position:absolute;top:-6px;right:-7px;width:16px;height:16px;border-radius:50%;background:var(--coral-500);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,138,31,.5)}70%{box-shadow:0 0 0 9px rgba(217,138,31,0)}100%{box-shadow:0 0 0 0 rgba(217,138,31,0)}}
@media (prefers-reduced-motion:reduce){.cur .dot{animation:none;box-shadow:0 0 0 4px rgba(217,138,31,.25)}}
.when{text-align:center;font-size:12px;line-height:1.35;min-height:34px;margin-top:3px}
.when .t{font-weight:650}.when .gap{color:var(--ink-500)}
.col.cur .when{color:var(--amber-600);font-weight:700}
.col.todo .when,.col.skip .when{color:var(--ink-400)}
.metrics{min-height:84px;border-top:1px dashed var(--line2);padding:7px 1px 4px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;min-width:0}
.metrics .m{color:var(--ink-700);line-height:1.4}
.scard{margin-top:6px;background:#eef8fd;border:1px solid #b4dff3;border-radius:10px;padding:8px 10px;min-height:132px;display:flex;flex-direction:column;font-size:12.5px;min-width:0;transition:box-shadow .15s}
.scard:hover{box-shadow:0 2px 8px rgba(17,118,166,.14)}
.scard .ti{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:12px;color:var(--ocean-700)}
.scard .sub{font-size:11px;color:var(--ocean-600);margin-bottom:4px;font-weight:600}
.scard .ln{color:var(--ink-700);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.45;overflow-wrap:anywhere;margin-bottom:1px}
.scard .xem{margin-top:auto;padding-top:6px}
.scard .xem button{background:none;border:none;color:var(--ocean-600);font-weight:700;padding:0;font-size:12px}
.scard .xem button:hover{text-decoration:underline}
.scard.open{border-color:var(--ocean-600);box-shadow:0 0 0 2px var(--ocean-600) inset;background:#fff}
.scard.skip{background:var(--surface-100);border:1px dashed var(--line2);color:var(--ink-400);justify-content:center;align-items:center;text-align:center}
.scard.todo{background:var(--surface-100);border-color:var(--line)}
.scard.todo .ti,.scard.todo .sub{color:var(--ink-400)}
.scard.cur{background:#fffaf0;border-color:#efc27c}
.scard.cur .ti{color:var(--amber-700)}.scard.cur .sub{color:var(--amber-600)}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:12px;color:var(--ink-500);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.legend .lg{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #bccbd6;flex:none}
.panel{border:1px solid var(--ocean-500);border-top:4px solid var(--ocean-600);border-radius:12px;background:#fff;padding:14px 16px;margin-top:14px;scroll-margin-top:10px}
.ph{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.ph .pt{font-weight:700;font-size:15px}.ph .ps{font-size:12.5px;color:var(--ink-500);margin-top:1px}
.ph .btn{margin-left:auto;flex:none}
.sec{margin-top:14px}
.sec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sec-h b{font-size:13.5px}
.sec-h .btn{margin-left:auto}
.li{border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-top:6px;background:#fff}
.li .lt{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.li .lm{font-size:12px;color:var(--ink-500);margin-top:2px}
.li .lb{font-size:13px;margin-top:3px;color:var(--ink-700)}
.li .la{display:flex;gap:6px;margin-top:6px}
.li.gt{border-left:4px solid var(--violet-600)}
.li.loi{border-left:4px solid var(--coral-500)}.li.auto{border-left:4px solid var(--orange-500)}.li.bo{opacity:.6}
.toggle-all{margin-top:14px;display:flex;justify-content:center}
.vlog{margin-top:12px;border-left:2px solid var(--line2);padding-left:16px;margin-left:6px}
.vlog .e{position:relative;padding:5px 0;font-size:13px}
.vlog .e::before{content:"";position:absolute;left:-22px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--teal-500);border:2px solid #fff;box-shadow:0 0 0 1px var(--teal-500)}
.vlog .e.loi::before{background:var(--coral-500);box-shadow:0 0 0 1px var(--coral-500)}.vlog .e.gt::before{background:var(--violet-600);box-shadow:0 0 0 1px var(--violet-600)}.vlog .e.hen::before{background:var(--ocean-500);box-shadow:0 0 0 1px var(--ocean-500)}
.vlog .e .tt{font-size:11.5px;color:var(--ink-500);font-variant-numeric:tabular-nums}
.otherbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-100)}
/* luồng mobile: thanh 8 chấm + danh sách bước dọc */
.mrail{display:flex;margin:2px 0 6px}
.md{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0}
.md::before{content:"";position:absolute;top:12px;right:50%;width:100%;height:3px;background:var(--rail)}
.md:first-child::before{display:none}
.md.done::before,.md.cur::before{background:var(--teal-500)}
.md.skip::before{background:repeating-linear-gradient(90deg,#bccbd6 0 4px,transparent 4px 8px)}
.md .dot{width:26px;height:26px;font-size:11px}.md.cur .dot{width:26px;height:26px}
.md .dn{font-size:10.5px;color:var(--ink-400);font-weight:700}
.md.cur .dn{color:var(--amber-600)}
.mlist{margin-top:8px}
.ms{position:relative;padding-left:42px;scroll-margin-top:10px}
.ms::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--rail)}
.ms:first-child::before{top:18px}.ms:last-child::before{bottom:calc(100% - 18px)}
.ms.done::before{background:var(--teal-500)}
.ms.skip::before{background:repeating-linear-gradient(180deg,#bccbd6 0 4px,transparent 4px 8px)}
.ms>.dot{position:absolute;left:2px;top:4px}
.ms.cur>.dot{left:-1px;top:1px}
.ms-h{display:flex;gap:8px;align-items:flex-start;padding:6px 0 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ms-m{flex:1;min-width:0}
.ms-t{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;line-height:1.35}
.ms-t .no{font-size:11.5px;color:var(--ink-400);font-weight:700}
.ms-t .nm{font-weight:700;font-size:14.5px}
.ms-t .wh{margin-left:auto;font-size:12px;color:var(--ink-500);white-space:nowrap;font-variant-numeric:tabular-nums}
.ms.cur .ms-t .wh{color:var(--amber-600);font-weight:700}
.ms.cur .ms-t .nm{color:var(--amber-700)}
.ms.todo .ms-t .nm,.ms.skip .ms-t .nm{color:var(--ink-400);font-weight:600}
.ms-s{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12.5px;color:var(--ink-700);align-items:center}
.ms-s .m{line-height:1.4}
.ms-c{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ocean-600);font-size:14px;background:var(--ocean-100);margin-top:-2px;transition:transform .2s}
.ms.open .ms-c{transform:rotate(180deg)}
.ms.skip .ms-h{cursor:default;padding-bottom:8px}
.ms-b{position:relative;z-index:1;margin:-2px 0 12px -34px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;box-shadow:var(--shadow)}
.ms-b .tl{background:#eef8fd;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:4px}
.ms-b .tl .sub{font-size:12px;font-weight:700;color:var(--ocean-700);margin-bottom:2px}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:8px;box-shadow:0 -4px 14px rgba(15,37,54,.08)}
.actbar .btn{flex:1;min-height:42px;padding:5px 8px}
.actbar .btn.more{flex:0 0 46px}

/* ===== ② Quản lý tồn ===== */
.tonlayout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
.side{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;position:sticky;top:calc(var(--toph) + 14px);box-shadow:var(--shadow)}
.side .grp{font-size:10.5px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.07em;font-weight:700;padding:10px 9px 4px}
.side .grp:first-child{padding-top:4px}
.side button{display:flex;width:100%;align-items:center;gap:9px;border:none;background:none;padding:7px 9px;border-radius:9px;text-align:left;color:var(--ink-700);font-size:13.5px;line-height:1.3}
.side button:hover{background:var(--surface-100)}
.side button.on{background:var(--ocean-100);color:var(--ocean-800);font-weight:700}
.side .n{width:22px;height:22px;border-radius:50%;background:var(--surface-200);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-600)}
.side button.on .n{background:var(--ocean-600);color:#fff}
.side .c{margin-left:auto;font-size:12px;font-weight:600;background:var(--surface-200);border-radius:999px;padding:0 8px;color:var(--ink-600);font-variant-numeric:tabular-nums}
.side .c.hot{background:var(--coral-100);color:var(--coral-600)}
.side button.dis{color:var(--ink-500)}
.side button.xac .n{background:var(--violet-100);color:var(--violet-700)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:4px 0 12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff}
.kpi b{display:block;font-size:22px;line-height:1.25;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-500)}
.kpi.red b{color:var(--coral-600)}.kpi.pink b{color:var(--pink-700)}.kpi.violet b{color:var(--violet-700)}
.funnel{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.fbox{position:relative;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff;cursor:pointer;min-width:0;text-align:left;transition:border-color .15s,box-shadow .15s}
.fbox:hover{border-color:var(--ocean-400);box-shadow:0 2px 8px rgba(17,118,166,.12)}
.fbox .h{font-size:10.5px;color:var(--ink-400);font-weight:700;letter-spacing:.05em}
.fbox .t{font-weight:700;font-size:13px;line-height:1.3;min-height:34px}
.fbox .big{font-size:26px;line-height:1.2;font-weight:800;color:var(--ocean-700);font-variant-numeric:tabular-nums}
.fbox .big.zero{color:var(--ink-400)}
.fbox .s{font-size:11.5px;color:var(--ink-500);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbox .s.red{color:var(--coral-600);font-weight:600}
.fbox .bar{height:5px;border-radius:3px;background:var(--surface-200);margin-top:7px;overflow:hidden}
.fbox .bar i{display:block;height:100%;background:var(--coral-500)}
.fbox.xac{background:#fbf9ff;border-color:#e3d9fb}.fbox.xac .big{color:var(--violet-700)}
.fgrp{display:flex;gap:8px;margin:12px 0 6px;font-size:11.5px;font-weight:700;color:var(--ink-500);text-transform:uppercase;letter-spacing:.05em}
.fgrp span:first-child{flex:6}.fgrp span:last-child{flex:2;color:var(--violet-700)}
table.mx{border-collapse:separate;border-spacing:0;font-size:13px;width:100%;min-width:760px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
table.mx tr>*:first-child{position:sticky;left:0;background:#fff;text-align:left;z-index:1;border-left:1px solid var(--line);white-space:nowrap;min-width:96px}
table.mx tr:first-child>*{border-top:1px solid var(--line);background:var(--surface-100);font-size:11.5px;color:var(--ink-600);font-weight:650;line-height:1.3}
table.mx td.cl{cursor:pointer}table.mx td.cl:hover{background:var(--ocean-100)}
table.mx td.hot{background:#fdf0f0;color:var(--coral-600);font-weight:700}
table.mx td.z{color:var(--ink-400)}
table.mx th.xac{background:#f6f2ff!important;color:var(--violet-700)!important}

/* ===== Bảng kiểu Excel ===== */
.xt-bar{display:flex;gap:8px 12px;align-items:center;margin:4px 0 8px;flex-wrap:wrap;font-size:13px}
.xt-bar .hint{font-size:12px;color:var(--ink-500)}
.xt-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;max-height:640px}
table.xt{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.xt th{position:sticky;top:0;background:var(--surface-100);z-index:2;border-bottom:1px solid var(--line2);padding:0;text-align:left;white-space:nowrap}
table.xt th .hw{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 10px}
table.xt th .lb{cursor:pointer;flex:1;font-size:12px;color:var(--ink-600);font-weight:650;user-select:none}
table.xt th .lb:hover{color:var(--ocean-700)}
table.xt th .ar{font-size:10px;color:var(--ocean-600);margin-left:3px}
table.xt th .fb{border:1px solid transparent;background:none;border-radius:6px;padding:0 5px;color:var(--ink-400);font-size:12px;line-height:20px}
table.xt th .fb:hover{border-color:var(--line2);color:var(--ink-700)}
table.xt th.act{background:#fff6e6}
table.xt th.act .fb{color:#fff;background:var(--amber-500)}
table.xt th .x{border:none;background:none;color:var(--coral-600);font-size:12px;padding:0 3px}
table.xt td{border-bottom:1px solid #edf2f6;padding:7px 10px;vertical-align:top;white-space:nowrap}
table.xt td.wr{white-space:normal;min-width:230px}
table.xt tbody tr.rw{cursor:pointer}
table.xt tbody tr.rw:hover td{background:#f4fafd}
.xt-cards{display:none}
.xc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;margin-bottom:8px;box-shadow:var(--shadow)}
.xc.rw{cursor:pointer}
.xc-h{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;font-size:14px}
.xc-g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px;font-size:13px}
.xc-g>div{min-width:0;overflow-wrap:anywhere}
.xc-g span.l{display:block;font-size:11px;color:var(--ink-500)}
.xc-g .w{grid-column:1/-1}
.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(15,37,54,.2);padding:12px;width:272px;font-size:13px}
.pop input[type=text],.pop input[type=number],.pop input[type=date]{width:100%;border:1px solid var(--line2);border-radius:8px;padding:6px 8px;margin-top:6px}
.pop .lst{max-height:230px;overflow:auto;margin:6px 0;border:1px solid var(--line);border-radius:8px;padding:4px}
.pop .lst label{display:flex;gap:7px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.pop .lst label:hover{background:var(--surface-100)}
.pop .lst .cnt{margin-left:auto;font-size:11px;color:var(--ink-400);font-variant-numeric:tabular-nums}
.pop .two{display:flex;gap:8px}.pop .two>div{flex:1;min-width:0}
.pop .ft{display:flex;gap:6px;justify-content:space-between;margin-top:10px}
.pop .ttl{font-weight:700}
.pop .csr{display:flex;align-items:center;gap:6px;padding:8px 2px;border-bottom:1px solid var(--line)}
.pop .csr .cn{flex:1;min-width:0}
.pop .csr.act .cn{color:var(--amber-700);font-weight:700}
.pop .csr.act .cn::after{content:" ●";color:var(--amber-500)}
.pop .csr .btn.on{background:var(--ocean-600);color:#fff;border-color:var(--ocean-600)}
.pop-bk{position:fixed;inset:0;background:rgba(15,37,54,.38);z-index:59}
.grab{display:none;width:40px;height:4px;border-radius:9px;background:var(--line2);margin:-4px auto 10px}

/* ===== tooltip / modal / toast ===== */
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink-900);color:#fff;font-size:12px;border-radius:9px;padding:8px 11px;max-width:330px;display:none;line-height:1.55;box-shadow:0 8px 22px rgba(0,0,0,.25)}
#tip.sheet{left:0!important;right:0;top:auto!important;bottom:0;max-width:none;border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));font-size:14px;pointer-events:auto}
#tip.sheet::after{content:"Chạm chỗ khác để đóng";display:block;margin-top:10px;font-size:11.5px;color:rgba(255,255,255,.55)}
#modal{position:fixed;inset:0;background:rgba(15,37,54,.45);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .dlg{background:#fff;border-radius:16px;width:540px;max-width:100%;padding:18px 20px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#modal h3{font-size:16px}
#modal label.f{display:block;font-size:12px;font-weight:600;color:var(--ink-600);margin:12px 0 4px}
#modal select,#modal input,#modal textarea{width:100%;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:#fff}
#modal .hint{font-size:12px;color:var(--ink-500);margin-top:4px}
#modal .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:10px 18px;border-radius:12px;z-index:90;display:none;font-size:13.5px;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.25)}

/* ===== ③ Mã lỗi + ④ Phân tích ===== */
.codegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-width:0}
.cg h4{margin:0 0 6px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.cg h4 .k{width:24px;height:24px;border-radius:7px;background:var(--ocean-100);color:var(--ocean-700);display:grid;place-items:center;font-size:12px;flex:none}
.cg .it{font-size:12.5px;padding:4px 0;border-top:1px dashed var(--line);display:flex;gap:7px;line-height:1.4;align-items:flex-start}
.cg .it .chip{flex:none}
.cg .none{font-size:12px;color:var(--ink-400);font-style:italic;border-top:1px dashed var(--line);padding-top:4px}
.doc{max-width:1100px}
.doc h3{margin:22px 0 8px;color:var(--ocean-800);font-size:15.5px;padding-bottom:5px;border-bottom:2px solid var(--ocean-100)}
.doc h4{margin:14px 0 6px;font-size:14px}
.doc p{margin:6px 0}
.doc ol,.doc ul{margin:6px 0 6px 20px;padding:0}
.doc li{margin:4px 0}
table.st{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
table.st td,table.st th{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
table.st th{background:var(--surface-100);font-weight:650;color:var(--ink-700)}
.req{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0}
.rq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-100)}
.rq .rn{font-size:11px;font-weight:800;color:var(--ocean-600);letter-spacing:.06em}
.q{background:#f6f3ff;border:1px solid #ddd2fb;border-radius:12px;padding:10px 14px}
.ok-list li::marker{content:"✓  ";color:var(--teal-600);font-weight:700}
.crit{border-left:4px solid var(--amber-500);background:#fffaf0;border-radius:0 10px 10px 0;padding:8px 12px;margin:6px 0;font-size:13.5px}

/* ===== Popup Chi tiết ca (khớp CaseDetail.tsx) ===== */
.cd{position:fixed;inset:0;z-index:50;display:none;background:rgba(6,32,51,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.cd.on{display:flex;align-items:center;justify-content:center;padding:0}
.cd-box{background:var(--bg);border-radius:16px;box-shadow:0 25px 60px rgba(5,32,51,.35);width:98vw;height:calc(100vh - 2vw);height:calc(100dvh - 2vw);display:flex;flex-direction:column;overflow:hidden;animation:cdin .18s ease-out}
.cd.on.compact{padding:0;justify-content:flex-end;align-items:stretch}
.cd.compact .cd-box{width:100%;max-width:672px;height:100%;border-radius:0;animation:cdslide .2s ease-out}
@keyframes cdin{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
@keyframes cdslide{from{transform:translateX(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.cd-box{animation:none!important}}
.cd-h{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.cd-hl{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;flex:1;min-width:0}
.cd-hl h3{margin:0 4px 0 0;font-size:16px;font-weight:800;white-space:nowrap}
.cd-tags{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;min-width:0}
.cd-tags>*{flex:none}
.cd-back{display:flex;gap:4px}
.cd-hr{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.cd-cache{font-size:12px;color:var(--ink-500);display:flex;gap:6px;align-items:center}
.cd-cache button{border:0;background:none;color:var(--ocean-600);font-weight:700;padding:0}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 11px;font-size:12px;font-weight:650;color:var(--ink-500)}
.seg button.on{background:var(--ocean-500);color:#fff}
.cd-x{width:34px;height:34px;border-radius:9px;border:0;background:none;font-size:16px;color:var(--ink-500)}
.cd-x:hover{background:var(--surface-200)}
.cd-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 18px 0;container:cdb / inline-size}
.cd-b>.card:last-of-type{margin-bottom:14px}
.cd-f{display:none;position:sticky;bottom:0;z-index:5;margin:0 -18px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:8px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(15,37,54,.08)}
.cd-f .btn{flex:1;min-height:42px}
.n-only{display:none}
@container cdb (max-width: 959px){
  .w-only{display:none!important}.n-only{display:block}.cd-f{display:flex}
  .hdr{display:block}.hdr .acts{display:none}
  .meta{grid-template-columns:1fr 1fr;gap:8px 14px}.meta b{white-space:normal}
  .slabar{margin-left:0;min-width:0;width:100%}
}
@container cdb (max-width: 440px){ .meta{grid-template-columns:1fr} }
.grp-b{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fff}
.grp-h{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;margin-bottom:6px}
.grp-h b{font-size:13.5px}
.cu{font-size:11px;color:var(--ink-400);font-style:italic}
.grp-h .cu{margin-left:auto}
.ta,.sel{width:100%;border:1px solid var(--line2);border-radius:8px;padding:7px 9px;background:#fff}
.vpd{margin-top:6px;font-size:13px}
.vpd summary{cursor:pointer;color:var(--ocean-600);font-weight:650;font-size:12.5px}
.lflow{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--ink-400);margin-top:4px}
.lflow .ok{color:var(--teal-600);font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.pimg{aspect-ratio:1;border-radius:8px;background:linear-gradient(135deg,var(--surface-200),#dde7ee);display:grid;place-items:center;font-size:20px;color:var(--ink-400)}
.pimg.v{background:var(--ink-700);color:#fff}
.phu{padding-top:12px}
.otabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.otabs::-webkit-scrollbar{display:none}
.otabs button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--ink-700);white-space:nowrap}
.otabs button .c{font-size:11px;background:var(--surface-200);border-radius:99px;padding:0 6px;color:var(--ink-600)}
.otabs button.on{background:var(--ocean-600);border-color:var(--ocean-600);color:#fff}
.otabs button.on .c{background:rgba(255,255,255,.25);color:#fff}
.otabs button.z{color:var(--ink-400)}
.otabs .more{border-style:dashed;color:var(--ocean-600)}
@media (max-width:767px){ .cd-h{padding:10px 12px;flex-wrap:nowrap;align-items:flex-start}.cd-hl{flex-direction:column;align-items:stretch;gap:6px}.cd-tags{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-12px;padding-right:12px}.cd-tags::-webkit-scrollbar{display:none}.cd-b{padding:12px 12px 0}.cd-f{margin:0 -12px}.cd-hl h3{font-size:15px} }

/* ===== v2: nút ẩn/hiện tiến trình + tab quạt 8 bước ===== */
.tt-tg{flex:none}
.tt-body{margin-bottom:6px;padding-bottom:12px;border-bottom:1px dashed var(--line2)}
.col.sel .shead .nm{color:var(--ocean-700)}
.col.sel .shead{box-shadow:inset 0 -3px 0 var(--ocean-500)}
.fan{display:grid;align-items:stretch;padding:12px 2px 0;transition:grid-template-columns .25s ease}
.ftab{position:relative;min-width:0;margin:0 0 -1px -8px;border:1px solid #c5e3f2;border-bottom:0;border-radius:12px 12px 0 0;background:#eef8fd;padding:10px 12px 10px 14px;min-height:160px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:-4px 0 10px rgba(15,37,54,.07);transform:translateY(calc(4px + var(--d, 1) * 9px));z-index:calc(30 - var(--d, 1));transition:transform .22s ease,box-shadow .18s,background .18s;cursor:pointer;color:var(--ink-900);overflow:hidden;font:inherit}
.ftab:first-child{margin-left:0}
.ftab:hover:not(.on):not(.skip){transform:translateY(calc(var(--d, 1) * 9px - 2px))}
.ftab:focus-visible{outline:2px solid var(--ocean-400);outline-offset:-2px}
.ftab::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--rail)}
.ftab.done::before{background:var(--teal-500)}.ftab.cur::before{background:var(--amber-500)}
.ftab.cur{background:#fffaf0;border-color:#efc27c}
.ftab.todo{background:var(--surface-100);border-color:var(--line)}
.ftab.skip{background:var(--surface-100);border-style:dashed;cursor:default;color:var(--ink-400)}
.ftab.skip::before{background:repeating-linear-gradient(90deg,#bccbd6 0 6px,transparent 6px 11px)}
.ftab.on{transform:none;z-index:50;background:#fff;border-color:var(--ocean-500);box-shadow:0 -8px 24px rgba(17,118,166,.22);min-height:184px;cursor:default}
.ftab.on::before{background:var(--ocean-600);height:5px}
.ftab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#fff}
.ft-h{display:flex;align-items:center;gap:6px;min-width:0}
.ft-n{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;background:#fff;border:2px solid #bccbd6;color:var(--ink-500)}
.ftab.done .ft-n{background:var(--teal-500);border-color:var(--teal-500);color:#fff}
.ftab.cur .ft-n{background:var(--amber-500);border-color:var(--amber-500);color:#fff}
.ftab.skip .ft-n{border-style:dashed;background:var(--surface-100)}
.ft-t{font-weight:750;font-size:13px;line-height:1.25;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftab.on .ft-t{font-size:15.5px;white-space:normal}
.ft-h .chip{flex:none}
.ft-s{font-size:11.5px;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ftab.cur .ft-s{color:var(--amber-600);font-weight:700}
.ft-sub{font-size:11px;font-weight:700;color:var(--ocean-600);margin-top:5px}
.ftab.todo .ft-sub{color:var(--ink-400)}
.ft-b .ln{font-size:12.5px;color:var(--ink-700);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.ftab:not(.on) .ft-b .ln:nth-child(n+3){display:none}
.ftab.on .ft-b{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px;margin-top:2px}
.ftab.on .ft-b .ln{-webkit-line-clamp:unset;display:block;font-size:13.5px}
.ft-m{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line2);font-size:12.5px;align-items:center}
.ft-m .m{line-height:1.4}
.ft-f{margin-top:6px;padding-top:2px;font-size:12px;font-weight:700;color:var(--ocean-600)}
.ftab.on .ft-f{color:var(--ink-400);margin-top:auto;padding-top:6px}
.fpanel{position:relative;z-index:40;border:1px solid var(--ocean-500);border-radius:0 0 12px 12px;background:#fff;padding:14px 16px;margin:0 2px;box-shadow:0 10px 24px rgba(17,118,166,.1);scroll-margin-top:10px}
@container cdb (max-width: 959px){
  .fan{display:flex!important;overflow-x:auto;scrollbar-width:none;padding:12px 0 0;margin:0 -2px}
  .fan::-webkit-scrollbar{display:none}
  .ftab{flex:0 0 132px;min-height:136px}
  .ftab.on{flex-basis:min(396px,84%);min-height:150px}
  .ftab.on .ft-b{grid-template-columns:1fr}
  .fpanel{margin:0;border-top:3px solid var(--ocean-600);border-radius:0 0 12px 12px;padding:12px}
}
/* thanh quy trình gọn */
.qrail{display:flex;margin:2px 0 4px}
.qs{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:2px 2px 4px;border-radius:8px;cursor:pointer;color:var(--ink-700)}
.qs:hover{background:var(--surface-100)}
.qs::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:3px;background:var(--rail);z-index:0}
.qs:first-child::before{display:none}
.qs.done::before,.qs.cur::before{background:var(--teal-500)}
.qs.skip::before{background:repeating-linear-gradient(90deg,#bccbd6 0 4px,transparent 4px 8px)}
.qs .dot{width:26px;height:26px;font-size:11px;position:relative;z-index:1}

function loLKH(c) { const g = c.gt[c.gt.length - 1]; return !!(g && c.cur <= 6 && g.duKien < NOW); }

function nhatKy(c) {

  for (const l of c.loi) ev.push({ t: l.t, cls: "loi", txt: `Lỗi ${l.ma} [bước ${l.buoc}]: ${esc(MA[l.ma].ten)} · ${l.tuDong ? "máy tự phát hiện" : esc(l.nguoi)}${l.tt === "Đã bỏ" ? " (đã bỏ)" : ""}` });

/* ======================================================================
   6. BẢNG KIỂU EXCEL DÙNG CHUNG (lọc + sắp xếp trên tiêu đề cột; mobile = thẻ + bảng lọc trượt)
   ====================================================================== */
const XT = {};
function xtState(id) { return XT[id] || (XT[id] = { sort: null, f: {} }); }
function xtVal(col, r) { return col.get ? col.get(r) : r[col.key]; }

  if (col.type === "text") return !!f.trim();

}
function xtPass(col, f, r) {
  if (!xtActive(col, f)) return true;
  const v = xtVal(col, r);
  if (col.type === "text") return boDau(v).includes(boDau(f.trim()));
  if (col.type === "multi") { const arr = Array.isArray(v) ? v : [v]; return arr.some(x => f.has(String(x))); }
  if (col.type === "num") { const n = Number(v); return (f.from === "" || n >= Number(f.from)) && (f.to === "" || n <= Number(f.to)); }
  if (col.type === "date") { const d = v ? fmtISO(v) : ""; return d && (!f.from || d >= f.from) && (!f.to || d <= f.to); }

}
const fmtISO = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const cellHTML = (c, r) => c.render ? c.render(r) : esc(xtVal(c, r));
function xtRender(host, id, cols, rows, onRow) {
  const s = xtState(id);
  let out = rows.filter(r => cols.every(c => xtPass(c, s.f[c.key], r)));
  if (s.sort) {
    const col = cols.find(c => c.key === s.sort.key), dir = s.sort.dir;
    if (col) out = out.slice().sort((a, b) => {
      let x = xtVal(col, a), y = xtVal(col, b);
      if (Array.isArray(x)) x = x.join(","); if (Array.isArray(y)) y = y.join(",");
      if (x instanceof Date) x = +x; if (y instanceof Date) y = +y;
      if (x == null || x === "") return 1; if (y == null || y === "") return -1;
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      return String(x).localeCompare(String(y), "vi") * dir;
    });
  }
  const nAct = cols.filter(c => xtActive(c, s.f[c.key])).length;
  const cardCols = cols.filter(c => c.m);
  const sortCol = s.sort && cols.find(c => c.key === s.sort.key);
  host.innerHTML = `<div class="xt-bar"><span><b class="tnum">${out.length}</b> / ${rows.length} dòng</span>${nAct ? `<span class="badge b-amber">đang lọc ${nAct} cột</span><button class="btn sm" data-xt="clearall">✕ Xoá tất cả lọc</button>` : ""}
      <button class="btn sm mo-only" style="display:none" data-xt="sheet">⚙ Lọc &amp; sắp xếp${nAct ? ` (${nAct})` : ""}</button>${sortCol ? `<span class="hint mo-only" style="display:none">Sắp theo ${esc(sortCol.label)} ${s.sort.dir > 0 ? "▲" : "▼"}</span>` : ""}
      <span class="hint pc-only">Bấm tiêu đề cột để sắp xếp · ⏷ để lọc${onRow ? " · bấm dòng để mở chi tiết ca" : ""}</span></div>
  <div class="xt-wrap"><table class="xt"><thead><tr>${cols.map(c => {
    const act = xtActive(c, s.f[c.key]), ar = s.sort && s.sort.key === c.key ? (s.sort.dir > 0 ? "▲" : "▼") : "";
    return `<th class="${act ? "act" : ""}"><div class="hw"><span class="lb" data-xt="sort" data-k="${c.key}" title="Bấm để sắp xếp">${esc(c.label)}<span class="ar">${ar}</span></span>${act ? `<button class="x" title="Xoá lọc cột này" data-xt="clear" data-k="${c.key}">✕</button>` : ""}<button class="fb" title="Lọc cột này" data-xt="pop" data-k="${c.key}">⏷</button></div></th>`;
  }).join("")}</tr></thead><tbody>${out.map(r => `<tr class="${onRow ? "rw" : ""}" data-i="${rows.indexOf(r)}">${cols.map(c => `<td class="${c.w ? "wr" : ""}">${cellHTML(c, r)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${cols.length}" class="empty" style="text-align:center;padding:22px">Không có dòng nào khớp bộ lọc</td></tr>`}</tbody></table></div>
  <div class="xt-cards">${out.map(r => `<div class="xc ${onRow ? "rw" : ""}" data-i="${rows.indexOf(r)}"><div class="xc-h">${cols.filter(c => c.h).map(c => cellHTML(c, r)).join("")}</div>
      <div class="xc-g">${cardCols.map(c => `<div class="${c.w ? "w" : ""}"><span class="l">${esc(c.label)}</span>${cellHTML(c, r)}</div>`).join("")}</div></div>`).join("") || `<p class="empty" style="text-align:center">Không có dòng nào khớp bộ lọc</p>`}</div>`;
  host.querySelectorAll(".xt-bar .mo-only").forEach(x => x.style.display = "");

      if (a === "sort") { s.sort = s.sort && s.sort.key === k ? (s.sort.dir > 0 ? { key: k, dir: -1 } : null) : { key: k, dir: 1 }; redraw(); }
      if (a === "clear") { delete s.f[k]; redraw(); }

      if (a === "pop") xtPop(t, s, cols.find(c => c.key === k), rows, cols, redraw);
      if (a === "sheet") xtSheet(s, cols, rows, redraw);

    if (tr && onRow) onRow(rows[+tr.dataset.i]);
  };
}
let popEl = null, popBk = null;

  return popEl;
}
/* Mobile: 1 bảng trượt liệt kê mọi cột → chọn cột để lọc, ▲▼ để sắp xếp (cùng trạng thái lọc với bảng PC) */
function xtSheet(s, cols, rows, redraw) {
  const p = openPop(`<div class="ttl">Lọc &amp; sắp xếp</div><div class="small muted">Chọn cột để lọc · ▲▼ để sắp xếp</div>
    ${cols.map(c => { const act = xtActive(c, s.f[c.key]), so = s.sort && s.sort.key === c.key ? s.sort.dir : 0; return `<div class="csr ${act ? "act" : ""}"><span class="cn">${esc(c.label)}</span>
      <button class="btn sm ${so > 0 ? "on" : ""}" data-s="${c.key}" data-d="1" aria-label="Tăng dần">▲</button><button class="btn sm ${so < 0 ? "on" : ""}" data-s="${c.key}" data-d="-1" aria-label="Giảm dần">▼</button><button class="btn sm" data-f="${c.key}">Lọc</button></div>`; }).join("")}
    <div class="ft"><button class="btn" data-a="clr">Xoá tất cả lọc</button><button class="btn pri" data-a="close">Xong</button></div>`);
  p.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.s) { const d = +b.dataset.d; s.sort = s.sort && s.sort.key === b.dataset.s && s.sort.dir === d ? null : { key: b.dataset.s, dir: d }; redraw(); xtSheet(s, cols, rows, redraw); }
    if (b.dataset.f) xtPop(null, s, cols.find(c => c.key === b.dataset.f), rows, cols, redraw);
    if (b.dataset.a === "clr") { s.f = {}; redraw(); xtSheet(s, cols, rows, redraw); }
    if (b.dataset.a === "close") closePop();
  };
}
function xtPop(btn, s, col, rows, cols, redraw) {
  if (col.type === "text") {
    const p = openPop(`<div class="ttl">Tìm trong "${esc(col.label)}"</div><div class="small muted">Không phân biệt dấu / hoa thường</div><input type="text" value="${esc(s.f[col.key] || "")}" placeholder="Gõ từ cần tìm…"><div class="ft"><button class="btn sm" data-a="clr">Xoá</button><button class="btn sm pri" data-a="close">Xong</button></div>`, btn);
    const inp = p.querySelector("input"); inp.oninput = () => { s.f[col.key] = inp.value; redraw(); };
    p.querySelector("[data-a=clr]").onclick = () => { delete s.f[col.key]; inp.value = ""; redraw(); };
    p.querySelector("[data-a=close]").onclick = closePop;
    if (!MOBILE()) setTimeout(() => inp.focus(), 0);
  } else if (col.type === "multi") {
    const base = rows.filter(r => cols.every(c => c === col || xtPass(c, s.f[c.key], r)));
    const cnt = new Map();
    for (const r of rows) { const v = xtVal(col, r); for (const x of (Array.isArray(v) ? v : [v])) cnt.set(String(x), 0); }
    for (const r of base) { const v = xtVal(col, r); for (const x of (Array.isArray(v) ? v : [v])) cnt.set(String(x), cnt.get(String(x)) + 1); }
    const vals = [...cnt.keys()].sort((a, b) => (col.order ? col.order(a) - col.order(b) : a.localeCompare(b, "vi")));
    const sel = s.f[col.key] || new Set();
    const p = openPop(`<div class="ttl">Lọc "${esc(col.label)}"</div><div class="small muted">Chọn nhiều = khớp 1 giá trị bất kỳ · không tick = không lọc</div><input type="text" placeholder="Tìm giá trị…"><div class="lst">${vals.map(v => `<label data-v="${esc(v)}"><input type="checkbox" value="${esc(v)}" ${sel.has(v) ? "checked" : ""}> <span>${esc(v)}</span><span class="cnt">${cnt.get(v)}</span></label>`).join("")}</div>
      <div class="ft"><button class="btn sm" data-a="all">Chọn tất cả</button><button class="btn sm" data-a="none">Bỏ chọn</button><button class="btn sm pri" data-a="close">Xong</button></div>`, btn);
    const sync = () => { s.f[col.key] = new Set([...p.querySelectorAll(".lst input:checked")].map(x => x.value)); redraw(); };
    p.querySelectorAll(".lst input").forEach(x => x.onchange = sync);
    p.querySelector("input[type=text]").oninput = e => { const q = boDau(e.target.value); p.querySelectorAll(".lst label").forEach(l => l.style.display = boDau(l.dataset.v).includes(q) ? "" : "none"); };
    p.querySelector("[data-a=all]").onclick = () => { p.querySelectorAll(".lst label").forEach(l => { if (l.style.display !== "none") l.querySelector("input").checked = true; }); sync(); };
    p.querySelector("[data-a=none]").onclick = () => { p.querySelectorAll(".lst input").forEach(x => x.checked = false); sync(); };
    p.querySelector("[data-a=close]").onclick = closePop;
  } else {
    const f = s.f[col.key] || { from: "", to: "" }, typ = col.type === "date" ? "date" : "number";
    const p = openPop(`<div class="ttl">${col.type === "date" ? "Khoảng ngày" : "Khoảng giá trị"} "${esc(col.label)}"</div><div class="two" style="margin-top:6px"><div><span class="small muted">Từ</span><input type="${typ}" data-a="from" value="${f.from}"></div><div><span class="small muted">Đến</span><input type="${typ}" data-a="to" value="${f.to}"></div></div>
      ${col.type === "date" ? `<div class="small muted" style="margin-top:6px">Chọn 1 ngày: điền cùng 1 ngày ở cả 2 ô</div>` : ""}<div class="ft"><button class="btn sm" data-a="clr">Xoá</button><button class="btn sm pri" data-a="close">Xong</button></div>`, btn);
    const sync = () => { s.f[col.key] = { from: p.querySelector("[data-a=from]").value, to: p.querySelector("[data-a=to]").value }; redraw(); };
    p.querySelectorAll("input").forEach(x => x.oninput = sync);
    p.querySelector("[data-a=clr]").onclick = () => { delete s.f[col.key]; closePop(); redraw(); };
    p.querySelector("[data-a=close]").onclick = closePop;
  }
}
document.addEventListener("pointerdown", e => { if (popEl && !MOBILE() && !popEl.contains(e.target) && !e.target.closest("[data-xt=pop]")) closePop(); });

function cotRieng(n) {
  if (n === 2) return [{ key: "lan", label: "Số lần hẹn", type: "num", m: 1, get: r => r.lichHen.length }, { key: "kqhen", label: "KQ liên hệ cuối", type: "multi", m: 1, get: r => r.lichHen.length ? r.lichHen[r.lichHen.length - 1].kq : "Chưa liên hệ" }];

  if (n === 4) return [{ key: "po", label: "PO", type: "text", m: 1, get: r => r.po ? r.po.ma : "" }, { key: "ncc", label: "NCC", type: "multi", get: r => r.po ? r.po.ncc : "—" }, { key: "eta", label: "Hàng về dự kiến", type: "date", m: 1, get: r => r.po ? r.po.eta : null, render: r => r.po ? `<span class="tnum">${fmtT(r.po.eta)}</span>` + (r.po.eta < NOW ? ' <span class="chip loi">trễ</span>' : "") : "—" }, { key: "ldc", label: "Lý do chậm", type: "multi", m: 1, get: r => r.po && r.po.lyDo || "—" }];
  if (n === 5) return [{ key: "hangve", label: "Hàng về lúc", type: "date", m: 1, get: r => (r.moc[4] || r.moc[3] || {}).t, render: r => `<span class="tnum">${fmtT((r.moc[4] || r.moc[3] || {}).t)}</span>` }];
  if (n === 6) return [{ key: "slgt", label: "Số lần GT", type: "num", m: 1, get: r => r.gt.length }, { key: "lkh", label: "Kế hoạch", type: "multi", m: 1, get: r => loLKH(r) ? "Lỡ kế hoạch" : "Đúng kế hoạch" }];

      const top = {}; d.forEach(c => loiTaiSong(c, S.n).forEach(l => top[l.ma] = (top[l.ma] || 0) + 1));

        <div class="s">${d.length ? `TB chờ ${fmtDur(tb)}` : "Không có ca"}</div><div class="s ${hot ? "red" : ""}">${hot} quá SLA${S.slaH ? " " + fmtSla(S.slaH) : ""}</div><div class="s">${topTxt ? "Lỗi: " + topTxt : "Không có lỗi"}</div>

  const on = $("#side button.on"); if (on && MOBILE()) on.scrollIntoView({ inline: "center", block: "nearest" });
}

    <div class="ft"><button class="btn" data-m="huy">Huỷ</button><button class="btn pri" data-m="luu">Ghi nhận</button></div>`);

    bb();

    c.loi.push({ ma, buoc: b, t: new Date(NOW), nguoi: "QC (bạn đang demo)", ghiChu: gc, tuDong: false, tt: "Chờ QC chốt" });
    dongModal(); moBuoc = b; renderChiTiet(); cuonToiBuoc(b); toast(`Đã ghi nhận lỗi ${ma} vào bước ${b}. ${STEPS[b - 1].ten}`);
  };

function moGiaiTrinh() {
  const c = getCa(), b0 = Math.min(c.cur, 6);

    dongModal(); moBuoc = 6; renderChiTiet(); cuonToiBuoc(6); toast("Đã lưu giải trình tồn");
  };

/* Tooltip: máy tính = rê chuột; điện thoại = chạm chip → bảng trượt từ dưới lên */
const tip = $("#tip");
function anTip() { tip.style.display = "none"; tip.classList.remove("sheet"); }
if (HOVER) {
  document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); if (!t) { anTip(); return; } tip.innerHTML = t.dataset.tip; tip.style.display = "block"; });
  document.addEventListener("mousemove", e => { if (tip.style.display !== "block") return; const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - w - 8)) + "px"; tip.style.top = (e.clientY + 18 + h > innerHeight ? e.clientY - h - 10 : e.clientY + 18) + "px"; });
}
document.addEventListener("click", e => {
  if (tip.classList.contains("sheet")) { anTip(); if (!e.target.closest(".chip[data-tip]")) { e.stopPropagation(); e.preventDefault(); return; } }
  if (HOVER) return;
  const t = e.target.closest(".chip[data-tip]"); if (!t) return;
  e.stopPropagation(); e.preventDefault();
  tip.innerHTML = t.dataset.tip; tip.classList.add("sheet"); tip.style.display = "block";
}, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#modal").classList.contains("on")) dongModal(); else if (popEl) closePop(); else if (tip.style.display === "block") anTip(); else if ($("#cd").classList.contains("on")) closeCase(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".chip[data-tip]") && !HOVER) e.target.click();
});

renderDs(); openCase(CASES[0].id);
</script>
